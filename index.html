<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Sécurité Pro - V3</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root { --sidebar-width: 340px; --accent: #0070F6; --dark: #1e272e; --light-grey: #F4F4F4; --danger: #e74c3c; --success: #27ae60; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 0 20px; }
        .search-container { width: 60%; position: relative; z-index: 6000; }
        #search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: var(--light-grey); padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }

        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #eee; }
        .info-box { background: #eef6ff; padding: 10px; border-radius: 6px; border: 1px solid var(--accent); font-weight: bold; margin-top: 5px; color: #0056b3; font-size: 0.85rem; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; font-size: 0.85rem; text-align: center; display: block; text-decoration: none; }
        .btn-accent { background: var(--accent); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); margin-top: 10px; font-size: 10px; padding: 5px; }

        .edit-form { display: flex; flex-direction: column; gap: 5px; min-width: 220px; padding: 5px; }
        .edit-form input, .edit-form select { padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; width: 100%; box-sizing: border-box; }
        .edit-form label { font-size: 10px; font-weight: bold; color: #666; text-transform: uppercase; margin-top: 5px; }

        #picto-box { position: absolute; bottom: 20px; right: 20px; background: white; padding: 12px; border-radius: 8px; border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .picto-item { width: 60px; height: 35px; color: white; border: 2px solid black; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .layer-name-tooltip { background: rgba(0,0,0,0.7); color: white; border: none; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; pointer-events: none; }
        .text-marker-container { background: transparent !important; border: none !important; }
        .text-marker-element { text-align: center; white-space: nowrap; line-height: 1.2; }

        .unit-label-container { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .unit-box { border: 2px solid black; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 45px; height: 22px; font-size: 10px; }
        .unit-cie { border-radius: 50%; width: 35px; height: 35px; }
        .unit-brav { transform: rotate(45deg); width: 25px; height: 25px; margin-bottom: 8px; }
        .unit-brav span { transform: rotate(-45deg); }
        .unit-info { background: rgba(255,255,255,0.9); border: 1px solid black; padding: 1px 4px; font-size: 9px; margin-top: 2px; font-weight: bold; color: black; white-space: nowrap; border-radius: 2px; }

        .layer-item { padding:10px; margin-bottom:5px; border-radius:8px; border:1px solid #ddd; position: relative; cursor: pointer; }
        .layer-visibility { position: absolute; top: 10px; right: 10px; cursor: pointer; color: #666; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher une adresse..." autocomplete="off">
        </div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-expand"></i> Affichage</h3>
                <button class="btn btn-accent" onclick="toggleFullScreen()" style="background:#2c3e50">Plein Écran</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-ruler"></i> Mesures & Calculs</h3>
                <div id="measure-display" class="info-box">Sélectionnez une zone.</div>
                <div style="margin-top:10px;">
                    <small>Ratio : <span id="ratio-val">3</span> pers/m²</small>
                    <input type="range" id="ratio-slider" min="0.5" max="10" step="0.5" value="3" style="width:100%;">
                </div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Calques</h3>
                <div id="layers-list"></div>
                <button class="btn btn-accent" onclick="promptNewLayer()">+ Nouveau Calque</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-font"></i> Style du Texte</h3>
                <select id="global-text-font" style="width:100%; margin-bottom:5px;">
                    <option value="Arial">Arial</option>
                    <option value="Impact">Impact</option>
                </select>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="global-text-size" value="16" style="width:50%">
                    <input type="color" id="global-text-color" value="#000000" style="width:50%; height:30px;">
                </div>
                <label style="font-size:11px;"><input type="checkbox" id="global-text-bold" checked> Gras</label>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-file-export"></i> Gestion Projet</h3>
                <button class="btn btn-success" onclick="exportProject()"><i class="fa-solid fa-download"></i> Exporter Projet (.json)</button>
                <label class="btn btn-accent" style="margin-top:10px;">
                    <i class="fa-solid fa-upload"></i> Importer Projet
                    <input type="file" id="project-import" style="display:none" accept=".json">
                </label>
            </div>

            <button class="btn" style="background:#27ae60; margin-top:20px;" onclick="exportToImage()">Exporter Image HD</button>
        </aside>

        <main id="map">
            <div id="picto-box">
                <div class="picto-item" style="background:blue" onclick="selectUnit(event, 'CRS')">CRS</div>
                <div class="picto-item" style="background:#5D4037" onclick="selectUnit(event, 'GM')">GM</div>
                <div class="picto-item" style="background:red; border-radius:50%" onclick="selectUnit(event, 'CIE')">CIE</div>
                <div class="picto-item" style="background:green; transform:scale(0.8) rotate(45deg)" onclick="selectUnit(event, 'BRAV')"><span style="transform:rotate(-45deg)">BRAV</span></div>
                <div class="picto-item" style="background:#2c3e50" onclick="selectUnit(event, 'TEXT')"><i class="fa-solid fa-font"></i> TEXTE</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.9.3/src/leaflet.geometryutil.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const map = L.map('map', { center: [48.8566, 2.3522], zoom: 15 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
        
        let layersData = [];
        let activeLayerId = null;
        let selectedUnitType = null;
        let lastSelectedShape = null;

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // --- GESTION DES CALQUES ---
        function addNewLayer(name, id = Date.now()) {
            const group = new L.FeatureGroup().addTo(map);
            layersData.push({ id, name, group, showNames: true, visible: true });
            setActiveLayer(id);
            return id;
        }

        function setActiveLayer(id) {
            activeLayerId = id;
            updateUI();
        }

        function toggleLayerVisibility(id, event) {
            if(event) event.stopPropagation();
            const l = layersData.find(x => x.id === id);
            l.visible = !l.visible;
            if (l.visible) map.addLayer(l.group); else map.removeLayer(l.group);
            updateUI();
        }

        function toggleLayerNames(id) {
            const l = layersData.find(x => x.id === id);
            l.showNames = !l.showNames;
            refreshLayerNames(l);
            updateUI();
        }

        function refreshLayerNames(l) {
            l.group.eachLayer(layer => {
                if (l.showNames) {
                    const name = (layer.feature?.properties?.Nom) || "Zone";
                    layer.bindTooltip(name, { permanent: true, direction: 'center', className: 'layer-name-tooltip' }).openTooltip();
                } else {
                    layer.unbindTooltip();
                }
            });
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = layersData.map(l => `
                <div class="layer-item" style="background:${l.id === activeLayerId ? '#e3f2fd' : 'white'};">
                    <div onclick="setActiveLayer(${l.id})" style="font-weight:bold;">${l.name}</div>
                    <div class="layer-visibility" onclick="toggleLayerVisibility(${l.id}, event)">
                        <i class="fa-solid ${l.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
                    </div>
                    <div style="font-size:10px; margin-top:5px;">
                        <input type="checkbox" ${l.showNames ? 'checked' : ''} onchange="toggleLayerNames(${l.id})"> Afficher noms
                    </div>
                </div>
            `).join('');
            
            if (window.dc) map.removeControl(window.dc);
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            window.dc = new L.Control.Draw({
                edit: { featureGroup: activeGroup },
                draw: { marker: false, circle: false, circlemarker: false }
            });
            map.addControl(window.dc);
        }

        // --- CALCULS ET ÉDITION ---
        map.on('draw:edited', (e) => {
            e.layers.eachLayer(layer => {
                refreshMeasure(layer);
                const lObj = layersData.find(x => x.id === activeLayerId);
                if(lObj.showNames) refreshLayerNames(lObj);
            });
        });

        function updateProp(layerId, key, val) {
            const group = layersData.find(l => l.id === activeLayerId).group;
            const layer = group.getLayer(layerId);
            if(layer) {
                if(!layer.feature) layer.feature = { properties: {} };
                layer.feature.properties[key] = val;
                const lObj = layersData.find(x => x.id === activeLayerId);
                if(lObj.showNames) refreshLayerNames(lObj);
            }
        }

        function refreshMeasure(layer) {
            if (!layer) return;
            const ratio = document.getElementById('ratio-slider').value;
            document.getElementById('ratio-val').innerText = ratio;
            if (layer instanceof L.Polygon) {
                const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                const cap = Math.round(area * ratio);
                const name = layer.feature?.properties?.Nom || "Zone";
                document.getElementById('measure-display').innerHTML = `Nom: <b>${name}</b><br>Surface : <b>${area.toFixed(0)} m²</b><br>Capacité : <b>${cap.toLocaleString()} pers.</b>`;
            }
        }

        // --- EXPORT / IMPORT PROJET ---
        function exportProject() {
            const project = layersData.map(l => ({
                name: l.name,
                visible: l.visible,
                showNames: l.showNames,
                features: l.group.toGeoJSON()
            }));
            const blob = new Blob([JSON.stringify(project)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `projet_tactique_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        document.getElementById('project-import').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() {
                const data = JSON.parse(reader.result);
                layersData.forEach(l => map.removeLayer(l.group));
                layersData = [];
                data.forEach(projLayer => {
                    const id = addNewLayer(projLayer.name);
                    const lObj = layersData.find(x => x.id === id);
                    L.geoJSON(projLayer.features, {
                        onEachFeature: (feature, layer) => {
                            if(feature.properties.color) {
                                layer.setStyle({color: feature.properties.color, fillColor: feature.properties.color});
                            }
                            layer.bindPopup(() => createEditablePopup(layer));
                            lObj.group.addLayer(layer);
                        }
                    });
                    lObj.visible = projLayer.visible;
                    lObj.showNames = projLayer.showNames;
                    refreshLayerNames(lObj);
                });
            };
            reader.readAsText(e.target.files[0]);
        });

        // --- INITIALISATION ---
        map.on(L.Draw.Event.CREATED, (e) => {
            const layer = e.layer;
            layersData.find(l => l.id === activeLayerId).group.addLayer(layer);
            layer.feature = layer.feature || { properties: { Nom: "Nouvelle Zone" }};
            layer.bindPopup(() => createEditablePopup(layer));
            refreshMeasure(layer);
            refreshLayerNames(layersData.find(l => l.id === activeLayerId));
        });

        function createEditablePopup(layer) {
            const id = L.stamp(layer);
            const props = layer.feature.properties;
            return `<div class="edit-form">
                <label>Nom</label><input type="text" value="${props.Nom}" onchange="updateProp(${id}, 'Nom', this.value)">
                <button class="btn btn-danger" onclick="deleteFeature(${id})">Supprimer</button>
            </div>`;
        }

        function deleteFeature(id) {
            layersData.find(l => l.id === activeLayerId).group.removeLayer(id);
        }

        function selectUnit(e, type) { e.stopPropagation(); selectedUnitType = type; map.getContainer().style.cursor = 'crosshair'; }

        map.on('click', (e) => {
            if (!selectedUnitType) return;
            const group = layersData.find(l => l.id === activeLayerId).group;
            if (selectedUnitType === 'TEXT') {
                const txt = prompt("Texte :");
                if(txt) {
                    const icon = L.divIcon({
                        className: 'text-marker-container',
                        html: `<div class="text-marker-element" style="font-family:${document.getElementById('global-text-font').value}; font-size:${document.getElementById('global-text-size').value}px; color:${document.getElementById('global-text-color').value}; font-weight:${document.getElementById('global-text-bold').checked?'bold':'normal'};">${txt}</div>`
                    });
                    const m = L.marker(e.latlng, {icon, draggable:true}).addTo(group);
                    m.feature = {properties: {Nom: txt}};
                    m.bindPopup(() => createEditablePopup(m));
                }
            }
            selectedUnitType = null; map.getContainer().style.cursor = '';
        });

        function exportToImage() {
            document.getElementById('picto-box').style.display = 'none';
            html2canvas(document.getElementById('map'), {useCORS:true, scale:2}).then(c => {
                const a = document.createElement('a'); a.download = 'plan.jpg'; a.href = c.toDataURL('image/jpeg', 0.9); a.click();
                document.getElementById('picto-box').style.display = 'flex';
            });
        }

        addNewLayer("Secteur Tactique 1");
    </script>
</body>
</html>
