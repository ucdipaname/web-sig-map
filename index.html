
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paris Geo-Tourisme Pro - Géocodage Intégré</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        :root {
            --sidebar-bg: #1a1c23;
            --panel-header: #252836;
            --accent-color: #3498db;
            --route-color: #2ecc71;
            --delete-color: #e74c3c;
            --text-main: #ecf0f1;
        }

        body { margin: 0; display: flex; font-family: 'Inter', sans-serif; background: var(--sidebar-bg); overflow: hidden; }
        #sidebar { width: 350px; height: 100vh; background: var(--sidebar-bg); color: var(--text-main); padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 2000; border-right: 1px solid #333; }
        #map { flex-grow: 1; height: 100vh; }

        .control-panel { background: var(--panel-header); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .toolbox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .icon-item { background: #34495e; padding: 10px; border-radius: 8px; text-align: center; cursor: grab; font-size: 1.5rem; transition: 0.2s; }
        .icon-item:hover { background: var(--accent-color); transform: scale(1.1); }

        .btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-route { background: var(--route-color); color: white; }
        .btn-delete { background: var(--delete-color); color: white; }
        
        .fiche-detail { background: white; color: #1a1c23; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
        .addr-badge { font-size: 0.75rem; color: #7f8c8d; background: #f1f2f6; padding: 4px 8px; border-radius: 4px; display: block; margin-top: 5px; }
        .map-label { background: rgba(255, 255, 255, 0.9); border: 1px solid #333; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="control-panel">
        <h3 style="margin:0; font-size: 1rem;">🛰️ GÉOCODAGE ACTIF</h3>
        <p style="font-size: 0.8rem; color: #bdc3c7;">Les adresses sont détectées automatiquement lors du dépôt d'icônes.</p>
    </div>

    <div id="route-info" class="control-panel" style="display:none; border-left: 4px solid var(--route-color);">
        <div id="stat-distance">-- km</div>
        <div id="stat-time">-- min</div>
    </div>

    <h3 style="font-size: 1rem;">📍 ÉLÉMENTS RAPIDES</h3>
    <div class="control-panel">
        <div class="toolbox">
            <div class="icon-item" draggable="true" data-icon="🏨">🏨</div>
            <div class="icon-item" draggable="true" data-icon="🍴">🍴</div>
            <div class="icon-item" draggable="true" data-icon="📸">📸</div>
            <div class="icon-item" draggable="true" data-type="text" data-icon="📝">📝</div>
        </div>
    </div>

    <button class="btn" style="background: var(--accent-color); color:white" onclick="exportData()">💾 Exporter GeoJSON</button>
    <button class="btn" style="background: transparent; color: #e74c3c; border: 1px solid #e74c3c" onclick="confirmReset()">⚠️ Vider la carte</button>

    <div id="fiche" class="fiche-detail">
        <h3 id="fiche-titre" style="margin:0">Détails</h3>
        <div id="fiche-addr" class="addr-badge">Recherche d'adresse...</div>
        <p id="fiche-desc" style="margin-top:10px; font-size:0.9rem;"></p>
        <div id="measure-result"></div>
        <div id="route-actions" style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="btn btn-route" style="margin:0" onclick="setRoutePoint('start')">Départ</button>
            <button class="btn btn-route" style="margin:0; background:#27ae60" onclick="setRoutePoint('end')">Arrivée</button>
        </div>
        <button class="btn btn-delete" onclick="deleteElement()">🗑️ Supprimer</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
    const map = L.map('map').setView([48.8588, 2.347], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSM' }).addTo(map);

    const drawnItems = new L.FeatureGroup().addTo(map);
    let selectedLayer = null;
    let routingControl = null;
    let routePoints = { start: null, end: null };

    // --- RECHERCHE MANUELLE ---
    L.Control.geocoder({ defaultMarkGeocode: true, placeholder: "Chercher une rue..." }).addTo(map);

    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: { marker: false, circlemarker: false, circle: false }
    });
    map.addControl(drawControl);

    // --- FONCTION DE GÉOCODAGE INVERSE (COORD -> ADRESSE) ---
    async function getAddress(lat, lng) {
        try {
            const response = await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${lng}&lat=${lat}`);
            const data = await response.json();
            return data.features.length > 0 ? data.features[0].properties.label : "Adresse inconnue";
        } catch (err) {
            return "Erreur de géocodage";
        }
    }

    // --- DESSIN MANUEL ---
    map.on(L.Draw.Event.CREATED, function (e) {
        const layer = e.layer;
        const title = prompt("Nom de l'élément :", "Nouveau tracé");
        layer.options.title = title;
        layer.options.address = "Élément géométrique";
        
        layer.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            selectedLayer = layer;
            showFiche(title, "Tracé manuel", layer.options.address);
        });
        drawnItems.addLayer(layer);
        saveToLocalStorage();
    });

    // --- DRAG & DROP AVEC GÉOCODAGE ---
    let draggedData = null;
    document.querySelectorAll('.icon-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
            draggedData = { icon: e.target.getAttribute('data-icon'), type: e.target.getAttribute('data-type') };
        });
    });

    const mapDiv = document.getElementById('map');
    mapDiv.addEventListener('dragover', (e) => e.preventDefault());
    mapDiv.addEventListener('drop', async (e) => {
        e.preventDefault();
        const rect = mapDiv.getBoundingClientRect();
        const latlng = map.containerPointToLatLng([e.clientX - rect.left, e.clientY - rect.top]);
        
        if (draggedData.type === 'text') {
            const txt = prompt("Texte de l'étiquette :");
            if (txt) createTextLabel(latlng, txt);
        } else {
            const title = prompt("Nom du lieu ?", "Étape");
            if (title) {
                // Appel au géocodage inverse
                const address = await getAddress(latlng.lat, latlng.lng);
                createMarker(latlng, draggedData.icon, title, address);
            }
        }
    });

    function createMarker(latlng, icon, title, address) {
        const customIcon = L.divIcon({
            html: `<div style="font-size: 24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4))">${icon}</div>`,
            className: 'custom-div-icon', iconSize: [30, 30], iconAnchor: [15, 15]
        });
        const marker = L.marker(latlng, { icon: customIcon }).addTo(drawnItems);
        marker.options.title = title;
        marker.options.address = address;

        marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectedLayer = marker;
            showFiche(title, "Marker", address);
        });
        saveToLocalStorage();
    }

    function createTextLabel(latlng, text) {
        const label = L.marker(latlng, {
            icon: L.divIcon({ className: 'map-label', html: text, iconSize: [100, 20] })
        }).addTo(drawnItems);
        label.options.title = text;
        label.options.address = "Annotation";
        label.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            selectedLayer = label;
            showFiche("Texte", text, "Annotation libre");
        });
        saveToLocalStorage();
    }

    // --- ITINÉRAIRE ---
    function setRoutePoint(type) {
        if (!selectedLayer || !selectedLayer.getLatLng) return;
        routePoints[type] = selectedLayer.getLatLng();
        if (routePoints.start && routePoints.end) calculateRoute();
    }

    function calculateRoute() {
        if (routingControl) map.removeControl(routingControl);
        routingControl = L.Routing.control({
            waypoints: [ routePoints.start, routePoints.end ],
            lineOptions: { styles: [{ color: '#2ecc71', weight: 5 }] },
            createMarker: () => null
        }).addTo(map);
        
        routingControl.on('routesfound', (e) => {
            const s = e.routes[0].summary;
            document.getElementById('route-info').style.display = 'block';
            document.getElementById('stat-distance').innerText = `📏 ${(s.totalDistance/1000).toFixed(1)} km`;
            document.getElementById('stat-time').innerText = `⏱️ ${Math.round(s.totalTime/60)} min`;
        });
    }

    // --- UI ---
    function showFiche(titre, desc, address) {
        const f = document.getElementById('fiche');
        f.style.display = 'block';
        document.getElementById('fiche-titre').innerText = titre;
        document.getElementById('fiche-desc').innerText = desc;
        document.getElementById('fiche-addr').innerText = address || "Calcul de l'adresse...";
        
        document.getElementById('route-actions').style.display = (selectedLayer && selectedLayer.getLatLng) ? 'flex' : 'none';
    }

    function deleteElement() {
        if(selectedLayer) {
            drawnItems.removeLayer(selectedLayer);
            document.getElementById('fiche').style.display = 'none';
            saveToLocalStorage();
        }
    }

    function saveToLocalStorage() { localStorage.setItem('parisGeoV7', JSON.stringify(drawnItems.toGeoJSON())); }
    function exportData() {
        const blob = new Blob([JSON.stringify(drawnItems.toGeoJSON())], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'export.geojson'; a.click();
    }
    function confirmReset() { if(confirm("Effacer tout ?")) { drawnItems.clearLayers(); localStorage.removeItem('parisGeoV7'); } }

</script>
</body>
</html>
