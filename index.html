<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géo-Tactique V24 - Fix Position</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
        #sidebar { width: 300px; background: #f4f4f4; border-right: 1px solid #ccc; padding: 15px; z-index: 1000; }
        #map { flex: 1; position: relative; }

        /* --- LE FIX ABSOLU --- */
        /* On neutralise TOUT ce que Leaflet essaie de faire */
        .leaflet-marker-icon.tactical-fix {
            margin: 0 !important;
            padding: 0 !important;
            outline: none !important;
            background: none !important;
            border: none !important;
        }

        /* On crée une boîte qui remonte par rapport au point d'origine */
        .anchor-point {
            position: absolute;
            bottom: 0;   /* Le bas de la boîte sera sur le point de clic */
            left: 50%;   /* On centre horizontalement */
            transform: translateX(-50%); /* Centrage parfait */
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px;
            pointer-events: none;
        }

        .l-name { background: white; border: 1px solid #000; font-size: 11px; font-weight: bold; padding: 1px 4px; white-space: nowrap; }
        .l-box { width: 60px; height: 22px; border: 2px solid #000; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; margin-top: -1px; }
        .l-time { background: #222; color: #0f0; font-family: monospace; font-size: 10px; padding: 1px 4px; border: 1px solid #000; margin-top: -1px; }

        .btn { width: 100%; padding: 10px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        #picto-box { position: absolute; bottom: 20px; right: 20px; z-index: 2000; background: white; padding: 10px; border: 2px solid #333; display: flex; flex-direction: column; gap: 5px; }
        .p-btn { width: 60px; height: 30px; color: white; border: 1px solid #000; cursor: pointer; font-size: 10px; font-weight: bold; text-align: center; line-height: 30px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>TACTIQUE V24</h3>
    <div id="layers"></div>
    <button class="btn" onclick="createNewLayer()">+ Nouveau Calque</button>
    <hr>
    <button class="btn" style="background: green; color: white;" onclick="exportData()">Exporter .geojson</button>
</div>

<div id="map">
    <div id="picto-box">
        <div class="p-btn" style="background: blue;" onclick="setUnit('CRS')">CRS</div>
        <div class="p-btn" style="background: brown;" onclick="setUnit('GM')">GM</div>
        <div class="p-btn" style="background: red;" onclick="setUnit('CIE')">CIE</div>
        <div class="p-btn" style="background: #2c3e50;" onclick="setUnit('INFO')">INFO</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    const map = L.map('map').setView([48.8566, 2.3522], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentLayer = null;
    let typeToPlace = null;

    function createNewLayer() {
        currentLayer = new L.FeatureGroup().addTo(map);
        const drawControl = new L.Control.Draw({
            edit: { featureGroup: currentLayer },
            draw: { circle: false, marker: true }
        });
        map.addControl(drawControl);
    }

    function setUnit(t) { 
        typeToPlace = t; 
        map.getContainer().style.cursor = 'crosshair'; 
    }

    map.on('click', function(e) {
        if (!typeToPlace || !currentLayer) return;

        const name = prompt("NOM :");
        if (!name) { resetPlacement(); return; }
        const time = prompt("HEURE :", new Date().getHours() + ":" + String(new Date().getMinutes()).padStart(2, '0'));

        const colors = { CRS: 'blue', GM: 'brown', CIE: 'red', INFO: '#2c3e50' };

        // HTML avec le wrapper anchor-point
        const html = `
            <div class="anchor-point">
                <div class="l-name">${name}</div>
                <div class="l-box" style="background: ${colors[typeToPlace]}">${typeToPlace}</div>
                <div class="l-time">${time}</div>
            </div>
        `;

        // L'astuce : iconSize [1,1] et iconAnchor [0,0] pour coller au clic
        const icon = L.divIcon({
            className: 'tactical-fix',
            html: html,
            iconSize: [1, 1], 
            iconAnchor: [0, 0] 
        });

        L.marker(e.latlng, { icon: icon, draggable: true }).addTo(currentLayer);
        resetPlacement();
    });

    function resetPlacement() { 
        typeToPlace = null; 
        map.getContainer().style.cursor = ''; 
    }

    function exportData() {
        const data = currentLayer.toGeoJSON();
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'plan.geojson';
        a.click();
    }

    createNewLayer();
</script>

</body>
</html>
