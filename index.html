<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Expert - Styles & Linéaires</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root { --sidebar-width: 340px; --accent: #0070F6; --dark: #1e272e; --light-grey: #F4F4F4; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #top-bar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .search-container { width: 60%; }
        #search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; }
        #container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: var(--light-grey); padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }
        
        #picto-box { position: absolute; bottom: 20px; right: 20px; background: white; padding: 10px; border-radius: 8px; border: 2px solid var(--dark); z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
        .picto-item { width: 50px; height: 30px; color: white; border: 1px solid black; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: grab; }
        
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #eee; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; display: block; text-align: center; font-size: 0.85rem; }
        .btn-accent { background: var(--accent); }
        .active-l { background: #e3f2fd; border: 1px solid var(--accent); border-radius: 4px; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-container"><input type="text" id="search-input" placeholder="Rechercher une adresse..."></div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Calques</h3>
                <div id="layers-list"></div>
                <button class="btn btn-accent" onclick="promptNewLayer()">+ Nouveau Calque Nommé</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-ruler-combined"></i> Analyse</h3>
                <div id="measure-display" style="font-weight: bold; color: var(--accent);">Aucune mesure.</div>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-paint-brush"></i> Style rapide</h3>
                <small>Couleur :</small>
                <input type="color" id="style-color" value="#0070F6" style="width:100%">
                <small>Style :</small>
                <select id="style-dash" style="width:100%; margin-bottom: 5px;">
                    <option value="">Plein</option>
                    <option value="5, 10">Pointillés</option>
                    <option value="15, 15">Tirets</option>
                </select>
                <small>Épaisseur :</small>
                <input type="range" id="style-weight" min="1" max="10" value="4" style="width:100%">
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-file-import"></i> Import / Export</h3>
                <label class="btn btn-accent">
                    Importer (CSV, JSON, SHP .zip)
                    <input type="file" id="sig-import" style="display:none" accept=".csv,.geojson,.json,.zip">
                </label>
                <button class="btn btn-accent" onclick="exportAll()">Exporter Projet</button>
            </div>
        </aside>

        <main id="map" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
            <div id="picto-box">
                <div class="picto-item" style="background:#0000FF" draggable="true" ondragstart="event.dataTransfer.setData('type','CRS')">CRS</div>
                <div class="picto-item" style="background:#5D4037" draggable="true" ondragstart="event.dataTransfer.setData('type','GM')">GM</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.9.3/src/leaflet.geometryutil.min.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

    <script>
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
        const map = L.map('map', { center: [46.6, 2.2], zoom: 6, layers: [satellite] });
        L.control.layers({ "Satellite": satellite, "Vue Allégée": light }).addTo(map);

        let layersData = [];
        let activeLayerId = null;

        function promptNewLayer() {
            const name = prompt("Nom du calque :", `Calque ${layersData.length + 1}`);
            if (name) addNewLayer(name);
        }

        function addNewLayer(name) {
            const id = Date.now();
            const group = new L.FeatureGroup().addTo(map);
            layersData.push({ id, name, group });
            activeLayerId = id;
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = layersData.map(l => `
                <div class="layer-item ${l.id === activeLayerId ? 'active-l' : ''}" style="padding:5px; cursor:pointer;" onclick="activeLayerId=${l.id}; updateUI();">
                    <i class="fa-solid fa-folder"></i> ${l.name}
                </div>
            `).join('');
            updateDrawControl();
        }

        function updateDrawControl() {
            if (window.drawControl) map.removeControl(window.drawControl);
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: activeGroup },
                draw: { circle:false, marker:false, circlemarker:false, polyline:true, polygon:true }
            });
            map.addControl(window.drawControl);
        }

        map.on(L.Draw.Event.CREATED, e => {
            const layer = e.layer;
            
            // Appliquer les styles définis dans la barre latérale
            const color = document.getElementById('style-color').value;
            const dash = document.getElementById('style-dash').value;
            const weight = document.getElementById('style-weight').value;

            layer.setStyle({
                color: color,
                dashArray: dash,
                weight: parseInt(weight)
            });

            layersData.find(l => l.id === activeLayerId).group.addLayer(layer);
            processMeasurement(layer);
        });

        function processMeasurement(layer) {
            let out = "";
            if (layer instanceof L.Polygon) {
                const a = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                out = `Surface: ${a.toFixed(1)} m²`;
            } else if (layer instanceof L.Polyline) {
                const d = L.GeometryUtil.accumulatedDistance(layer.getLatLngs());
                out = `Distance: ${d.toFixed(1)} m`;
            }
            document.getElementById('measure-display').innerText = out;
            layer.bindPopup(out).openPopup();
        }

        document.getElementById('sig-import').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;

            reader.onload = async function(ev) {
                if (file.name.endsWith('.zip')) {
                    const geojson = await shp(ev.target.result);
                    L.geoJSON(geojson, { onEachFeature: (f,l) => activeGroup.addLayer(l) });
                } else {
                    const gj = JSON.parse(ev.target.result);
                    L.geoJSON(gj, { onEachFeature: (f,l) => activeGroup.addLayer(l) });
                }
            };
            if (file.name.endsWith('.zip')) reader.readAsArrayBuffer(file);
            else reader.readAsText(file);
        };

        function handleDrop(e) {
            e.preventDefault();
            const type = e.dataTransfer.getData('type');
            const latlng = map.mouseEventToLatLng(e);
            const name = prompt("Nom de l'unité ?", type);
            if (name) {
                const color = (type === 'CRS') ? '#0000FF' : '#5D4037';
                const icon = L.divIcon({
                    html: `<div style="background:${color}; border:1px solid black; color:white; font-size:9px; padding:2px; text-align:center;">${type}<br>${name}</div>`,
                    iconSize: [40, 30]
                });
                L.marker(latlng, { icon: icon, draggable: true }).addTo(layersData.find(l => l.id === activeLayerId).group);
            }
        }

        function exportAll() {
            let data = {};
            layersData.forEach(l => data[l.name] = l.group.toGeoJSON());
            const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = 'export_plan.json'; a.click();
        }

        addNewLayer("Secteur Principal");
    </script>
</body>
</html>
