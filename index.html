<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géo-Tactique V18 - Mesures & Jauges</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        :root { --sidebar-width: 320px; --accent: #0070F6; --dark: #1e272e; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: #f8f9fa; padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }
        .card { background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin-top: 5px; }
        .btn-accent { background: var(--accent); color: white; }
        #search-container { position: absolute; top: 10px; left: 50px; z-index: 1000; display: flex; gap: 5px; background: white; padding: 5px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #search-input { width: 200px; border: 1px solid #ccc; padding: 5px; }
        #picto-box { position: absolute; bottom: 30px; right: 10px; background: white; padding: 10px; border-radius: 8px; border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .picto-btn { width: 60px; height: 35px; border: 1px solid black; color: white; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .color-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: inline-block; margin: 2px; border: 1px solid #ccc; }
        .info-measure { font-size: 0.8rem; color: #555; margin-top: 5px; padding: 5px; background: #fffde7; border-left: 3px solid #fbc02d; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 style="margin:0 0 10px 0;">ANALYSE TACTIQUE</h2>
        
        <div class="card">
            <strong><i class="fa fa-ruler-combined"></i> Mesures & Densité</strong>
            <div id="measure-output" class="info-measure">Sélectionnez ou créez une zone pour voir les stats.</div>
            <div style="margin-top:10px;">
                <label style="font-size: 0.75rem;">Ratio : <span id="ratio-label">3</span> pers/m²</label>
                <input type="range" id="ratio-slider" min="0.5" max="6" step="0.5" value="3" style="width:100%;">
            </div>
        </div>

        <div class="card">
            <strong>Couleur de tracé</strong>
            <div id="color-palette">
                <div class="color-dot" style="background:#3388ff" data-color="#3388ff"></div>
                <div class="color-dot" style="background:#e74c3c" data-color="#e74c3c"></div>
                <div class="color-dot" style="background:#2ecc71" data-color="#2ecc71"></div>
                <div class="color-dot" style="background:#f1c40f" data-color="#f1c40f"></div>
            </div>
        </div>

        <div class="card">
            <strong><i class="fa fa-layer-group"></i> Calques</strong>
            <div id="layers-list"></div>
            <button class="btn btn-accent" onclick="createNewLayer()">+ Nouveau Calque</button>
        </div>

        <div class="card">
            <input type="file" id="shp-import" accept=".zip" class="btn" style="font-size:10px; background:#eee;">
            <button class="btn" style="background:#27ae60; color:white; margin-top:10px;" onclick="exportProject()">Exporter (.geojson)</button>
        </div>
    </aside>

    <div id="map">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Adresse...">
            <button class="btn btn-accent" style="margin:0; width:40px;" onclick="searchAddress()"><i class="fa fa-search"></i></button>
        </div>

        <div id="picto-box">
            <div class="picto-btn" style="background:blue" onclick="prepareUnit('CRS')">CRS</div>
            <div class="picto-btn" style="background:#5D4037" onclick="prepareUnit('GM')">GM</div>
            <div class="picto-btn" style="background:red" onclick="prepareUnit('CIE')">CIE</div>
            <div class="picto-btn" style="background:green" onclick="prepareUnit('BRAV')">BRAV</div>
            <div class="picto-btn" style="background:#2c3e50" onclick="prepareUnit('TEXTE')">TEXTE</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const map = L.map('map', { center: [48.8566, 2.3522], zoom: 13, layers: [light] });
        L.control.layers({"Plan": light, "Satellite": satellite}, null, {position: 'topright'}).addTo(map);

        let projectLayers = [];
        let currentActiveId = null;
        let pendingUnit = null;
        let currentDrawColor = "#3388ff";

        // --- RECHERCHE ---
        async function searchAddress() {
            const q = document.getElementById('search-input').value;
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
            const d = await r.json();
            if(d[0]) map.setView([d[0].lat, d[0].lon], 17);
        }

        // --- CALCULS TURF ---
        function updateMeasurements(layer) {
            const geojson = layer.toGeoJSON();
            let output = "";
            const ratio = document.getElementById('ratio-slider').value;

            if (layer instanceof L.Polygon) {
                const area = turf.area(geojson); // en m²
                const perim = turf.length(geojson, {units: 'meters'});
                output = `Surface : <b>${Math.round(area)} m²</b><br>
                          Périmètre : <b>${Math.round(perim)} m</b><br>
                          Capacité approx : <b>${Math.round(area * ratio)} pers.</b>`;
            } else if (layer instanceof L.Polyline) {
                const len = turf.length(geojson, {units: 'meters'});
                output = `Longueur : <b>${Math.round(len)} m</b>`;
            }
            document.getElementById('measure-output').innerHTML = output;
        }

        // --- GESTION COULEURS ---
        document.querySelectorAll('.color-dot').forEach(d => {
            d.onclick = () => { currentDrawColor = d.dataset.color; setActiveLayer(currentActiveId); };
        });

        // --- CALQUES & DESSIN ---
        function createNewLayer(name = "Calque") {
            const group = new L.FeatureGroup().addTo(map);
            const id = "L-" + Date.now();
            projectLayers.push({ id, name, group });
            setActiveLayer(id);
            return projectLayers[projectLayers.length-1];
        }

        function setActiveLayer(id) {
            currentActiveId = id;
            const active = projectLayers.find(l => l.id === id);
            if (window.drawControl) map.removeControl(window.drawControl);
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: active.group },
                draw: {
                    polygon: { shapeOptions: { color: currentDrawColor, fillOpacity: 0.4 } },
                    polyline: { shapeOptions: { color: currentDrawColor } },
                    rectangle: { shapeOptions: { color: currentDrawColor } },
                    marker: true, circle: false
                }
            });
            map.addControl(window.drawControl);
            updateUI();
        }

        map.on('draw:created', (e) => {
            const layer = e.layer;
            const active = projectLayers.find(l => l.id === currentActiveId);
            active.group.addLayer(layer);
            updateMeasurements(layer);
            layer.on('click', () => updateMeasurements(layer));
        });

        // --- PICTOS ---
        function prepareUnit(type) { pendingUnit = type; map.getContainer().style.cursor = 'crosshair'; }
        map.on('click', (e) => {
            if (!pendingUnit) return;
            const label = prompt("Nom/ID :");
            if (label) {
                const colors = { CRS: 'blue', GM: '#5D4037', CIE: 'red', BRAV: 'green', TEXTE: 'white' };
                const html = `<div style="border:2px solid black; background:${colors[pendingUnit]}; color:${pendingUnit==='TEXTE'?'black':'white'}; font-size:10px; text-align:center; min-width:55px; padding:2px;">
                                ${pendingUnit}<br><span style="background:white; color:black; display:block; font-size:9px;">${label}</span>
                              </div>`;
                const m = L.marker(e.latlng, { icon: L.divIcon({ html: html, iconSize:[60,35] }), draggable:true });
                projectLayers.find(l => l.id === currentActiveId).group.addLayer(m);
            }
            pendingUnit = null; map.getContainer().style.cursor = '';
        });

        document.getElementById('ratio-slider').oninput = function() {
            document.getElementById('ratio-label').innerText = this.value;
        };

        function updateUI() {
            document.getElementById('layers-list').innerHTML = projectLayers.map(l => 
                `<div class="layer-item ${l.id === currentActiveId ? 'active' : ''}" onclick="setActiveLayer('${l.id}')">${l.name}</div>`
            ).join('');
        }

        function exportProject() {
            const all = [];
            projectLayers.forEach(l => {
                const gj = l.group.toGeoJSON();
                gj.features.forEach(f => { f.properties.calque = l.name; all.push(f); });
            });
            const blob = new Blob([JSON.stringify({type:"FeatureCollection", features:all})], {type:"application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "plan_mesure.geojson"; a.click();
        }

        createNewLayer("Secteur 1");
    </script>
</body>
</html>
