<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paris Geo-Tourisme Pro - Smart Transit</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        :root {
            --sidebar-bg: #1a1c23;
            --panel-header: #252836;
            --accent-color: #3498db;
            --route-color: #2ecc71;
            --poi-color: #f1c40f;
            --text-main: #ecf0f1;
        }

        body { margin: 0; display: flex; font-family: 'Inter', sans-serif; background: var(--sidebar-bg); overflow: hidden; }
        #sidebar { width: 360px; height: 100vh; background: var(--sidebar-bg); color: var(--text-main); padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 2000; border-right: 1px solid #333; }
        #map { flex-grow: 1; height: 100vh; }

        .control-panel { background: var(--panel-header); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        
        /* Météo */
        .weather-info { display: flex; justify-content: space-between; align-items: center; }
        
        /* Tooltip & Icons */
        .toolbox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .icon-item { background: #34495e; padding: 10px; border-radius: 8px; text-align: center; cursor: grab; font-size: 1.5rem; transition: 0.2s; }
        .icon-item:hover { background: var(--accent-color); transform: scale(1.1); }

        .btn { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-poi { background: var(--poi-color); color: #2c3e50; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-delete { background: #e74c3c; color: white; }
        
        /* Transport Toggle */
        .transport-switch { display: flex; gap: 5px; background: #1a1c23; padding: 5px; border-radius: 8px; margin-top: 10px; }
        .t-btn { flex: 1; border: none; background: transparent; color: white; padding: 5px; cursor: pointer; border-radius: 5px; opacity: 0.5; }
        .t-btn.active { background: var(--accent-color); opacity: 1; }
        
        /* Fiche détail */
        .fiche-detail { background: white; color: #1a1c23; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
        .addr-badge { font-size: 0.75rem; color: #7f8c8d; background: #f1f2f6; padding: 4px 8px; border-radius: 4px; display: block; margin: 5px 0; }
        .poi-info { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 8px; font-size: 0.85rem; border: 1px dashed var(--poi-color); color: #333;}
        
        /* Masquage éléments Leaflet inutiles */
        .leaflet-routing-container { display: none; }

        @media print {
            #sidebar, .leaflet-control-container, .btn, .transport-switch { display: none !important; }
            body, #map { height: 600px !important; width: 100% !important; }
            .fiche-detail { display: block !important; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="control-panel" id="weather-panel">
        <div class="weather-info">
            <span style="font-size: 0.9rem;">🌤️ Paris, FR</span>
            <span id="temp-val" style="font-weight: bold;">--°C</span>
        </div>
        <div id="weather-desc" style="font-size: 0.75rem; color: #bdc3c7; margin-top: 5px;">Chargement...</div>
    </div>

    <div class="control-panel">
        <label style="font-size: 0.7rem; font-weight: bold; color: #95a5a6; display: block; margin-bottom: 5px;">PROJET :</label>
        <div style="display: flex; gap: 5px;">
            <select id="project-selector" class="btn" style="margin:0; background: #34495e; color: white; flex-grow: 1;" onchange="switchProject()">
                <option value="Default">Projet Principal</option>
            </select>
            <button class="btn" style="margin:0; width: 40px; background: var(--route-color); color: white;" onclick="createNewProject()">+</button>
            <button class="btn" style="margin:0; width: 40px; background: #e74c3c; color: white;" onclick="deleteProject()">🗑️</button>
        </div>
    </div>

    <div class="control-panel">
        <input type="file" id="csv-file" accept=".csv" style="display: none;" onchange="handleCSV(this)">
        <button class="btn" style="background: #2c3e50; color:white" onclick="document.getElementById('csv-file').click()">📥 Import CSV</button>
        <button class="btn" style="background: #2c3e50; color:white" onclick="exportToCSV()">📤 Export CSV</button>
        
        <div id="progress-container" style="display: none; margin-top: 10px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.6rem;">
                <span id="progress-text">Traitement...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div style="width: 100%; background: #1a1c23; height: 6px; border-radius: 3px; overflow: hidden; margin-top:3px;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: var(--route-color); transition: width 0.2s;"></div>
            </div>
        </div>
    </div>

    <h3 style="font-size: 0.9rem;">📍 ÉLÉMENTS RAPIDES</h3>
    <div class="control-panel">
        <div class="toolbox">
            <div class="icon-item" draggable="true" data-icon="🏨">🏨</div>
            <div class="icon-item" draggable="true" data-icon="🍴">🍴</div>
            <div class="icon-item" draggable="true" data-icon="📸">📸</div>
            <div class="icon-item" draggable="true" data-icon="📝">📝</div>
        </div>
    </div>

    <button class="btn" style="background: #9b59b6; color:white" onclick="printTrip()">🖨️ Imprimer / PDF</button>
    <button class="btn" style="background: transparent; color: #e74c3c; border: 1px solid #e74c3c" onclick="confirmReset()">⚠️ Vider Projet</button>

    <div id="fiche" class="fiche-detail">
        <h3 id="fiche-titre" style="margin:0">Détails</h3>
        <div id="fiche-addr" class="addr-badge">Adresse...</div>
        
        <label style="font-size: 0.7rem; font-weight: bold; color: #95a5a6; margin-top: 10px; display: block;">ITINÉRAIRE :</label>
        <div class="transport-switch">
            <button class="t-btn active" id="mode-foot" onclick="setMode('foot')">🚶</button>
            <button class="t-btn" id="mode-bike" onclick="setMode('cycling')">🚲</button>
        </div>

        <div style="display: flex; gap: 5px; margin-top: 10px;">
            <button class="btn btn-poi" onclick="smartNavigate('subway')">🚇 Métro</button>
            <button class="btn btn-poi" onclick="smartNavigate('bicycle_parking')">🚲 Vélib</button>
        </div>

        <div id="poi-status" class="poi-info" style="display:none;"></div>
        <button class="btn" style="margin-top:10px; background:#7f8c8d; color:white" onclick="clearNavigation()">🧹 Effacer Tracé</button>
        <button class="btn btn-delete" onclick="deleteElement()">🗑️ Supprimer Point</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
    const map = L.map('map').setView([48.8588, 2.347], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSM' }).addTo(map);

    const drawnItems = new L.FeatureGroup().addTo(map);
    const poiMarkers = new L.LayerGroup().addTo(map);
    let selectedLayer = null;
    let routingControl = null;
    let currentMode = 'foot';
    let currentProject = "Default";
    let draggedIcon = "📍";

    // --- MÉTÉO ---
    async function fetchWeather() {
        try {
            const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=48.85&longitude=2.34&current_weather=true');
            const data = await r.json();
            document.getElementById('temp-val').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            document.getElementById('weather-desc').innerText = "Ciel dégagé / Paris";
        } catch (e) { document.getElementById('weather-desc').innerText = "Météo indisponible"; }
    }

    // --- GESTION PROJETS ---
    function updateProjectSelector() {
        const selector = document.getElementById('project-selector');
        const projects = JSON.parse(localStorage.getItem('geo_ProjectList')) || ["Default"];
        selector.innerHTML = "";
        projects.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p; opt.innerText = p;
            if(p === currentProject) opt.selected = true;
            selector.appendChild(opt);
        });
    }

    function createNewProject() {
        const name = prompt("Nom du nouveau projet ?");
        if (name && name.trim() !== "") {
            let projects = JSON.parse(localStorage.getItem('geo_ProjectList')) || ["Default"];
            if (!projects.includes(name)) {
                projects.push(name);
                localStorage.setItem('geo_ProjectList', JSON.stringify(projects));
            }
            currentProject = name;
            drawnItems.clearLayers();
            clearNavigation();
            updateProjectSelector();
            saveToLocal();
        }
    }

    function switchProject() {
        currentProject = document.getElementById('project-selector').value;
        drawnItems.clearLayers();
        clearNavigation();
        loadFromLocal();
    }

    function deleteProject() {
        if (currentProject === "Default") return alert("Impossible de supprimer le projet par défaut.");
        if (confirm(`Supprimer le projet "${currentProject}" ?`)) {
            localStorage.removeItem(`geoData_${currentProject}`);
            let p = JSON.parse(localStorage.getItem('geo_ProjectList')).filter(x => x !== currentProject);
            localStorage.setItem('geo_ProjectList', JSON.stringify(p));
            currentProject = "Default";
            switchProject();
            updateProjectSelector();
        }
    }

    // --- PERSISTANCE ---
    function saveToLocal() {
        const data = [];
        drawnItems.eachLayer(l => {
            if (l instanceof L.Marker) {
                data.push({ latlng: l.getLatLng(), title: l.options.title, address: l.options.address, icon: l.options.icon.options.html });
            }
        });
        localStorage.setItem(`geoData_${currentProject}`, JSON.stringify(data));
    }

    function loadFromLocal() {
        const saved = localStorage.getItem(`geoData_${currentProject}`);
        if (!saved) return;
        JSON.parse(saved).forEach(item => {
            const m = createMarker(item.latlng, item.title, item.address, item.icon);
        });
    }

    // --- GESTION MARQUEURS ---
    function createMarker(latlng, title, addr, iconHtml) {
        const m = L.marker(latlng, {
            icon: L.divIcon({ html: iconHtml, className: 'custom-icon', iconSize:[30,30] })
        }).addTo(drawnItems);
        m.options.title = title;
        m.options.address = addr;
        m.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            selectedLayer = m;
            document.getElementById('fiche').style.display = 'block';
            document.getElementById('fiche-titre').innerText = title;
            document.getElementById('fiche-addr').innerText = addr;
        });
        return m;
    }

    // --- CSV IMPORT / EXPORT ---
    async function handleCSV(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const lines = e.target.result.split('\n').filter(l => l.trim().includes(';'));
            const container = document.getElementById('progress-container');
            container.style.display = 'block';
            
            for (let i = 0; i < lines.length; i++) {
                const [name, address] = lines[i].split(';');
                if (address) {
                    await geocodeAndAdd(name.trim(), address.trim());
                    const p = Math.round(((i+1)/lines.length)*100);
                    document.getElementById('progress-bar').style.width = p+'%';
                    document.getElementById('progress-percent').innerText = p+'%';
                }
            }
            setTimeout(() => container.style.display = 'none', 2000);
            saveToLocal();
        };
        reader.readAsText(file);
    }

    async function geocodeAndAdd(title, address) {
        try {
            const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(address)}&limit=1`);
            const d = await r.json();
            if (d.features.length > 0) {
                const c = d.features[0].geometry.coordinates;
                createMarker([c[1], c[0]], title, d.features[0].properties.label, `<div style="font-size:24px;">📍</div>`);
            }
        } catch (e) {}
    }

    function exportToCSV() {
        let csv = "Nom;Adresse\n";
        drawnItems.eachLayer(l => {
            if (l.options.title) csv += `${l.options.title};${l.options.address}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `export_${currentProject}.csv`;
        link.click();
    }

    // --- ROUTAGE ---
    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`mode-${mode === 'foot' ? 'foot' : 'bike'}`).classList.add('active');
    }

    async function smartNavigate(type) {
        if (!selectedLayer) return;
        clearNavigation();
        const origin = selectedLayer.getLatLng();
        const status = document.getElementById('poi-status');
        status.style.display = 'block';
        status.innerHTML = "🔍 Recherche...";

        let query = `[out:json];node["station"="${type}"](around:1000,${origin.lat},${origin.lng});out;`;
        if (type === 'bicycle_parking') query = `[out:json];node["amenity"="bicycle_parking"](around:1000,${origin.lat},${origin.lng});out;`;

        try {
            const resp = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
            const data = await resp.json();
            if (data.elements.length === 0) return status.innerHTML = "❌ Rien à proximité.";

            const closest = data.elements.reduce((prev, curr) => {
                const pD = origin.distanceTo([prev.lat, prev.lon]);
                const cD = origin.distanceTo([curr.lat, curr.lon]);
                return (cD < pD) ? curr : prev;
            });

            const target = L.latLng(closest.lat, closest.lon);
            L.circleMarker(target, { radius: 8, color: '#f1c40f', fillOpacity: 1 }).addTo(poiMarkers);
            
            routingControl = L.Routing.control({
                waypoints: [origin, target],
                router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1', profile: currentMode }),
                lineOptions: { styles: [{ color: currentMode==='foot'?'#f1c40f':'#3498db', weight: 4, dashArray: '5,10' }] },
                createMarker: () => null
            }).addTo(map);

            routingControl.on('routesfound', (e) => {
                const s = e.routes[0].summary;
                status.innerHTML = `✅ <strong>Station</strong><br>${currentMode==='foot'?'🚶':'🚲'} ${(s.totalDistance).toFixed(0)}m - ${Math.round(s.totalTime/60)} min.`;
            });
        } catch (e) { status.innerHTML = "❌ Erreur API."; }
    }

    function clearNavigation() {
        if (routingControl) { map.removeControl(routingControl); routingControl = null; }
        poiMarkers.clearLayers();
        document.getElementById('poi-status').style.display = 'none';
    }

    // --- INITIALISATION ---
    document.querySelectorAll('.icon-item').forEach(i => i.ondragstart = (e) => draggedIcon = e.target.dataset.icon);
    
    document.getElementById('map').ondragover = (e) => e.preventDefault();
    document.getElementById('map').ondrop = async (e) => {
        e.preventDefault();
        const rect = document.getElementById('map').getBoundingClientRect();
        const latlng = map.containerPointToLatLng([e.clientX - rect.left, e.clientY - rect.top]);
        const title = prompt("Nom ?");
        if (title) {
            const r = await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${latlng.lng}&lat=${latlng.lat}`);
            const d = await r.json();
            const addr = d.features[0]?.properties.label || "Inconnu";
            createMarker(latlng, title, addr, `<div style="font-size:24px;">${draggedIcon}</div>`);
            saveToLocal();
        }
    };

    function deleteElement() { if(selectedLayer) { drawnItems.removeLayer(selectedLayer); saveToLocal(); document.getElementById('fiche').style.display = 'none'; clearNavigation(); } }
    function confirmReset() { if(confirm("Vider ce projet ?")) { drawnItems.clearLayers(); saveToLocal(); clearNavigation(); } }
    function printTrip() { window.print(); }

    window.onload = () => { fetchWeather(); updateProjectSelector(); loadFromLocal(); };
</script>
</body>
</html>
