<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géo-Tactique V10 - Spécial Open Data Paris</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <style>
        :root { --sidebar-width: 320px; --accent: #0070F6; }
        body { margin: 0; display: flex; height: 100vh; font-family: sans-serif; }
        #sidebar { width: var(--sidebar-width); background: #f8f9fa; padding: 15px; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 1000; }
        #map { flex: 1; background: #e5e5e5; }
        .card { background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin-top: 5px; }
        .btn-accent { background: var(--accent); color: white; }
        .layer-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
        .layer-item.active { background: #e7f1ff; font-weight: bold; }
        .unit-box { border: 2px solid black; color: white; padding: 2px 5px; font-weight: bold; font-size: 10px; text-align: center; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2>Tactique Paris</h2>
        <div class="card">
            <strong>Calques</strong>
            <div id="layers-list"></div>
            <button class="btn btn-accent" onclick="createNewLayer()">+ Nouveau Calque</button>
        </div>
        <div class="card">
            <strong>Import Ville de Paris</strong>
            <input type="file" id="import-file" style="margin-top:10px;">
            <p style="font-size: 10px; color: #666; margin-top: 5px;">Note : Le fichier doit être en WGS84 (standard GeoJSON).</p>
        </div>
        <button class="btn" style="background:#27ae60; color:white;" onclick="exportProject()">Exporter Projet</button>
    </aside>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        const map = L.map('map').setView([48.8566, 2.3522], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        let projectLayers = [];
        let currentActiveId = null;

        function createNewLayer(name = "Calque") {
            const group = new L.FeatureGroup().addTo(map);
            const id = "L-" + Date.now();
            projectLayers.push({ id, name, group });
            setActiveLayer(id);
            updateUI();
        }

        function setActiveLayer(id) {
            currentActiveId = id;
            const active = projectLayers.find(l => l.id === id);
            if (window.drawControl) map.removeControl(window.drawControl);
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: active.group },
                draw: { marker: true, polygon: true, polyline: true, circle: false, circlemarker: false }
            });
            map.addControl(window.drawControl);
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = projectLayers.map(l => `
                <div class="layer-item ${l.id === currentActiveId ? 'active' : ''}" onclick="setActiveLayer('${l.id}')">
                    ${l.name}
                </div>
            `).join('');
        }

        map.on('draw:created', (e) => {
            const active = projectLayers.find(l => l.id === currentActiveId);
            active.group.addLayer(e.layer);
        });

        // --- MOTEUR D'IMPORTATION ROBUSTE ---
        document.getElementById('import-file').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const data = JSON.parse(reader.result);
                    const layerObj = createNewLayer("Import Paris");
                    const bounds = L.latLngBounds([]);

                    // Fonction récursive pour extraire les features (gère les collections)
                    const processFeatures = (coll) => {
                        const features = coll.features || (coll.type === "Feature" ? [coll] : []);
                        
                        features.forEach(f => {
                            if (!f.geometry) return;

                            let leafletObj;
                            const type = f.geometry.type;
                            const coords = f.geometry.coordinates;

                            // VERIFICATION LAMBERT (Si coordonnées > 180)
                            if (coords[0] > 180 || (Array.isArray(coords[0]) && coords[0][0] > 180)) {
                                alert("Attention : Ce fichier semble utiliser des coordonnées Lambert (mètres). Il doit être converti en WGS84 (degrés) pour s'afficher.");
                                return;
                            }

                            if (type === "Point") {
                                leafletObj = L.circleMarker([coords[1], coords[0]], { radius: 5, color: 'blue' });
                                bounds.extend([coords[1], coords[0]]);
                            } 
                            else if (type === "Polygon") {
                                const latlngs = coords[0].map(c => [c[1], c[0]]);
                                leafletObj = L.polygon(latlngs, { color: 'red', weight: 2 });
                                latlngs.forEach(ll => bounds.extend(ll));
                            }
                            else if (type === "MultiPolygon") {
                                const latlngs = coords.map(poly => poly[0].map(c => [c[1], c[0]]));
                                leafletObj = L.polygon(latlngs, { color: 'red', weight: 2 });
                                latlngs.flat().forEach(ll => bounds.extend(ll));
                            }

                            if (leafletObj) {
                                // Ajout des infos de la Ville de Paris en popup automatique
                                if (f.properties) {
                                    let info = "<b>Données Paris :</b><br>";
                                    for (let key in f.properties) {
                                        info += `${key}: ${f.properties[key]}<br>`;
                                    }
                                    leafletObj.bindPopup(info);
                                }
                                layerObj.group.addLayer(leafletObj);
                            }
                        });
                    };

                    processFeatures(data);

                    if (bounds.isValid()) {
                        map.fitBounds(bounds);
                    } else {
                        alert("Données importées mais hors limites ou mal formatées.");
                    }

                } catch (err) {
                    alert("Erreur critique : " + err.message);
                }
            };
            reader.readAsText(e.target.files[0]);
        };

        function exportProject() {
            const data = projectLayers.map(l => ({ name: l.name, data: l.group.toGeoJSON() }));
            const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "export_paris.json";
            a.click();
        }

        createNewLayer("Secteur Tactique 1");
    </script>
</body>
</html>
