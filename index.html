<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Géo-Tactique V26 Stable</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
body { margin:0; display:flex; height:100vh; font-family:Segoe UI; }
#map { flex:1; }

.tactical-tag{
    width:80px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.t-name{
    background:white;
    border:1px solid #000;
    font-size:10px;
    font-weight:bold;
    padding:1px 3px;
    border-radius:3px 3px 0 0;
}

.t-box{
    width:60px;
    height:20px;
    border:2px solid #000;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:11px;
    margin-top:-1px;
}

.t-time{
    background:#222;
    color:#0f0;
    font-family:monospace;
    font-size:9px;
    padding:1px 3px;
    border:1px solid #000;
    border-radius:0 0 3px 3px;
    margin-top:-1px;
}

.selected-marker .t-box{
    box-shadow:0 0 8px 3px rgba(0,120,255,0.7);
}

#picto-box{
    position:absolute;
    bottom:20px;
    right:20px;
    background:white;
    padding:10px;
    border:2px solid #333;
    display:flex;
    flex-direction:column;
    gap:5px;
    border-radius:8px;
    z-index:1000;
}

.p-btn{
    width:60px;
    height:30px;
    color:white;
    border:1px solid #000;
    cursor:pointer;
    font-size:10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="picto-box">
<div class="p-btn" style="background:blue;" onclick="setMode('CRS')">CRS</div>
<div class="p-btn" style="background:#5D4037;" onclick="setMode('GM')">GM</div>
<div class="p-btn" style="background:red;" onclick="setMode('CIE')">CIE</div>
<div class="p-btn" style="background:#2c3e50;" onclick="setMode('INFO')">INFO</div>
</div>

<script>

const map = L.map('map').setView([48.8566,2.3522],13);

/* FONDS */
const osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{ attribution:'© OpenStreetMap' }
).addTo(map);

const osmLight = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
{ attribution:'© OpenStreetMap © CARTO' }
);

const sat = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{ attribution:'© Esri' }
);

L.control.layers({
"OSM Standard":osm,
"OSM Clair":osmLight,
"Satellite":sat
}).addTo(map);

/* LOGIQUE */
let modePicto=null;

function setMode(type){
    modePicto=type;
    map.getContainer().style.cursor='crosshair';
}

function getTime(){
    const d=new Date();
    return d.getHours()+":"+String(d.getMinutes()).padStart(2,'0');
}

map.on('click',function(e){

if(!modePicto) return;

const name=prompt("Nom unité :");
if(!name){ modePicto=null; return;}

const radius=prompt("Rayon en mètres (optionnel) :");
const colors={CRS:'blue',GM:'#5D4037',CIE:'red',INFO:'#2c3e50'};

const html=`
<div class="tactical-tag">
<div class="t-name">${name}</div>
<div class="t-box" style="background:${colors[modePicto]}">${modePicto}</div>
<div class="t-time">${getTime()}</div>
</div>
`;

const marker=L.marker(e.latlng,{
icon:L.divIcon({className:'',html:html}),
draggable:true
}).addTo(map);

/* ANCRAGE DYNAMIQUE PIXEL PERFECT */
setTimeout(()=>{
const el=marker.getElement();
const w=el.offsetWidth;
const h=el.offsetHeight;

marker.setIcon(L.divIcon({
className:'',
html:html,
iconSize:[w,h],
iconAnchor:[w/2,h]
}));
},0);

/* HALO SELECTION */
marker.on('click',function(){
document.querySelectorAll('.selected-marker')
.forEach(el=>el.classList.remove('selected-marker'));
marker.getElement().classList.add('selected-marker');
});

/* CERCLE LIE */
let circle=null;
if(radius && !isNaN(radius)){
circle=L.circle(e.latlng,{
radius:Number(radius),
color:colors[modePicto],
fillOpacity:0.05,
weight:1
}).addTo(map);

marker.on('drag',function(ev){
circle.setLatLng(ev.target.getLatLng());
});
}

modePicto=null;
map.getContainer().style.cursor='';

});

</script>
</body>
</html>
