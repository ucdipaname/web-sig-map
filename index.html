<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paris Geo-Tourisme Pro - Smart Transit</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        :root {
            --sidebar-bg: #1a1c23;
            --panel-header: #252836;
            --accent-color: #3498db;
            --route-color: #2ecc71;
            --poi-color: #f1c40f;
            --text-main: #ecf0f1;
        }

        body { margin: 0; display: flex; font-family: 'Inter', sans-serif; background: var(--sidebar-bg); overflow: hidden; }
        #sidebar { width: 360px; height: 100vh; background: var(--sidebar-bg); color: var(--text-main); padding: 20px; box-sizing: border-box; overflow-y: auto; z-index: 2000; border-right: 1px solid #333; }
        #map { flex-grow: 1; height: 100vh; }

        .control-panel { background: var(--panel-header); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .toolbox { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .icon-item { background: #34495e; padding: 10px; border-radius: 8px; text-align: center; cursor: grab; font-size: 1.5rem; transition: 0.2s; }
        .icon-item:hover { background: var(--accent-color); transform: scale(1.1); }

        .btn { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-poi { background: var(--poi-color); color: #2c3e50; font-size: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-route { background: var(--route-color); color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        
        .fiche-detail { background: white; color: #1a1c23; padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
        .addr-badge { font-size: 0.75rem; color: #7f8c8d; background: #f1f2f6; padding: 4px 8px; border-radius: 4px; display: block; margin: 5px 0; }
        
        .poi-info { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 8px; font-size: 0.85rem; border: 1px dashed var(--poi-color); }
        
        /* Masquer le texte de Leaflet Routing Machine */
        .leaflet-routing-container { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="control-panel">
        <h3 style="margin:0; font-size: 1rem;">🛰️ SMART TRANSIT</h3>
        <p style="font-size: 0.8rem; color: #bdc3c7;">Calculez le chemin piéton vers le transport le plus proche.</p>
    </div>

    <div id="route-info" class="control-panel" style="display:none; border-left: 4px solid var(--route-color);">
        <div id="stat-distance" style="font-weight: bold;">-- km</div>
        <div id="stat-time" style="font-size: 0.9rem;">-- min</div>
    </div>

    <h3 style="font-size: 1rem;">📍 ÉLÉMENTS RAPIDES</h3>
    <div class="control-panel">
        <div class="toolbox">
            <div class="icon-item" draggable="true" data-icon="🏨">🏨</div>
            <div class="icon-item" draggable="true" data-icon="🍴">🍴</div>
            <div class="icon-item" draggable="true" data-icon="📸">📸</div>
            <div class="icon-item" draggable="true" data-type="text" data-icon="📝">📝</div>
        </div>
    </div>

    <button class="btn" style="background: var(--accent-color); color:white" onclick="exportData()">💾 Exporter Projet</button>
    <button class="btn" style="background: transparent; color: #e74c3c; border: 1px solid #e74c3c" onclick="confirmReset()">⚠️ Reset Carte</button>

    <div id="fiche" class="fiche-detail">
        <h3 id="fiche-titre" style="margin:0">Détails</h3>
        <div id="fiche-addr" class="addr-badge">Adresse...</div>
        
        <label style="font-size: 0.7rem; font-weight: bold; color: #95a5a6; margin-top: 10px; display: block;">REJOINDRE LE PLUS PROCHE :</label>
        <div style="display: flex; gap: 5px;">
            <button class="btn btn-poi" onclick="smartNavigate('subway')">🚇 Métro</button>
            <button class="btn btn-poi" onclick="smartNavigate('bicycle_parking')">🚲 Vélib</button>
        </div>

        <div id="poi-status" class="poi-info" style="display:none;"></div>

        <div id="route-actions" style="display: flex; gap: 5px; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
            <button class="btn btn-route" style="margin:0; font-size: 0.7rem;" onclick="setRoutePoint('start')">🚩 Dép.</button>
            <button class="btn btn-route" style="margin:0; font-size: 0.7rem; background:#27ae60" onclick="setRoutePoint('end')">🏁 Arr.</button>
            <button class="btn" style="margin:0; font-size: 0.7rem; background:#7f8c8d; color:white" onclick="clearNavigation()">🧹 Effacer</button>
        </div>
        <button class="btn btn-delete" onclick="deleteElement()">🗑️ Supprimer</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
    const map = L.map('map').setView([48.8588, 2.347], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OSM' }).addTo(map);

    const drawnItems = new L.FeatureGroup().addTo(map);
    const poiMarkers = new L.LayerGroup().addTo(map);
    let selectedLayer = null;
    let routingControl = null;
    let routePoints = { start: null, end: null };

    // --- GEOLOC ET DESSIN ---
    L.Control.geocoder({ defaultMarkGeocode: true }).addTo(map);
    const drawControl = new L.Control.Draw({ edit: { featureGroup: drawnItems }, draw: { marker: false, circle: false, circlemarker: false } });
    map.addControl(drawControl);

    // --- NAVIGATION INTELLIGENTE (POI + ROUTE) ---
    async function smartNavigate(type) {
        if (!selectedLayer) return;
        const origin = selectedLayer.getLatLng();
        const statusDiv = document.getElementById('poi-status');
        statusDiv.style.display = 'block';
        statusDiv.innerHTML = "🔍 Recherche de la station...";
        poiMarkers.clearLayers();

        let query = `[out:json];node["station"="${type}"](around:800,${origin.lat},${origin.lng});out;`;
        if (type === 'bicycle_parking') query = `[out:json];node["amenity"="bicycle_parking"](around:800,${origin.lat},${origin.lng});out;`;

        try {
            const resp = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
            const data = await resp.json();
            
            if (data.elements.length === 0) {
                statusDiv.innerHTML = "❌ Aucune station à moins de 800m.";
                return;
            }

            // Trouver la plus proche mathématiquement
            const closest = data.elements.reduce((prev, curr) => {
                const prevDist = origin.distanceTo([prev.lat, prev.lon]);
                const currDist = origin.distanceTo([curr.lat, curr.lon]);
                return (currDist < prevDist) ? curr : prev;
            });

            const targetLatLng = L.latLng(closest.lat, closest.lon);
            const name = closest.tags.name || (type === 'subway' ? "Métro" : "Point Vélib");

            statusDiv.innerHTML = `✅ <strong>${name}</strong> trouvé !<br>Tracé de l'itinéraire piéton...`;

            // Marquer la cible
            L.circleMarker(targetLatLng, { radius: 8, color: '#f1c40f', fillColor: '#f1c40f', fillOpacity: 1 }).addTo(poiMarkers).bindPopup(name);

            // Lancer le routage automatique
            calculateAutoRoute(origin, targetLatLng);

        } catch (err) { statusDiv.innerHTML = "❌ Erreur réseau."; }
    }

    function calculateAutoRoute(start, end) {
        if (routingControl) map.removeControl(routingControl);
        
        routingControl = L.Routing.control({
            waypoints: [start, end],
            router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1', profile: 'foot' }), // Profil PIÉTON
            lineOptions: { styles: [{ color: '#f1c40f', weight: 4, dashArray: '5, 10' }] },
            createMarker: () => null
        }).addTo(map);

        routingControl.on('routesfound', (e) => {
            const s = e.routes[0].summary;
            document.getElementById('poi-status').innerHTML += `<br>🚶 <strong>${(s.totalDistance).toFixed(0)}m</strong> - Env. <strong>${Math.round(s.totalTime/60)} min</strong> à pied.`;
        });
    }

    function clearNavigation() {
        if (routingControl) map.removeControl(routingControl);
        poiMarkers.clearLayers();
        document.getElementById('poi-status').style.display = 'none';
        document.getElementById('route-info').style.display = 'none';
        routePoints = { start: null, end: null };
    }

    // --- GESTION DES MARQUEURS ---
    async function getAddress(lat, lng) {
        const r = await fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${lng}&lat=${lat}`);
        const d = await r.json();
        return d.features.length > 0 ? d.features[0].properties.label : "Inconnu";
    }

    let draggedData = null;
    document.querySelectorAll('.icon-item').forEach(i => i.addEventListener('dragstart', (e) => draggedData = { icon: e.target.getAttribute('data-icon') }));
    
    document.getElementById('map').addEventListener('dragover', (e) => e.preventDefault());
    document.getElementById('map').addEventListener('drop', async (e) => {
        const latlng = map.containerPointToLatLng([e.clientX - 360, e.clientY]);
        const title = prompt("Nom ?");
        if (title) {
            const addr = await getAddress(latlng.lat, latlng.lng);
            const m = L.marker(latlng, { icon: L.divIcon({ html: draggedData.icon, className: 'custom-icon', iconSize:[30,30] }) }).addTo(drawnItems);
            m.options.title = title; m.options.address = addr;
            m.on('click', () => { selectedLayer = m; showFiche(title, addr); });
        }
    });

    function showFiche(t, a) {
        selectedLayer.getLatLng ? document.getElementById('fiche').style.display = 'block' : null;
        document.getElementById('fiche-titre').innerText = t;
        document.getElementById('fiche-addr').innerText = a;
        document.getElementById('poi-status').style.display = 'none';
    }

    function setRoutePoint(type) {
        routePoints[type] = selectedLayer.getLatLng();
        if (routePoints.start && routePoints.end) {
            if (routingControl) map.removeControl(routingControl);
            routingControl = L.Routing.control({ waypoints: [routePoints.start, routePoints.end] }).addTo(map);
        }
    }

    function deleteElement() { drawnItems.removeLayer(selectedLayer); document.getElementById('fiche').style.display = 'none'; }
    function confirmReset() { if(confirm("Vider ?")) { drawnItems.clearLayers(); clearNavigation(); } }
</script>
</body>
</html>
