<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Sécurité - Pictos Dynamiques</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root { --sidebar-width: 340px; --accent: #0070F6; --dark: #1e272e; --light-grey: #F4F4F4; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 0 20px; }
        .search-container { width: 60%; position: relative; z-index: 6000; }
        #search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; }
        #search-results { position: absolute; top: 55px; left: 0; right: 0; background: white; border-radius: 8px; z-index: 9999; max-height: 250px; overflow-y: auto; display: none; border: 1px solid #ccc; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: var(--light-grey); padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }

        /* Fenêtre Pictos */
        #picto-box { position: absolute; bottom: 20px; right: 20px; background: white; padding: 12px; border-radius: 8px; border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .picto-item { width: 60px; height: 35px; color: white; border: 2px solid black; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .picto-selected { outline: 4px solid #ff9f43; transform: scale(1.05); }

        /* Conteneur d'unité avec mise à l'échelle dynamique */
        .unit-label-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: transform 0.2s ease-out; /* Animation fluide lors du zoom */
        }
        
        .unit-box { border: 2px solid black; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 45px; height: 22px; font-size: 10px; }
        .unit-info { background: rgba(255,255,255,0.9); border: 1px solid black; padding: 1px 4px; font-size: 9px; margin-top: 1px; font-weight: bold; color: black; white-space: nowrap; }

        .layer-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; margin-bottom: 5px; border-radius: 5px; border: 1px solid #ddd; background: white; cursor: pointer; }
        .layer-active { background: #e3f2fd; border-color: #0070F6; }

        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #eee; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; font-size: 0.85rem; text-align: center; display: block; }
        .btn-accent { background: var(--accent); }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher une adresse..." autocomplete="off">
            <div id="search-results"></div>
        </div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Calques</h3>
                <div id="layers-list"></div>
                <button class="btn btn-accent" onclick="promptNewLayer()">+ Nouveau Calque</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-users"></i> Capacité</h3>
                <div id="measure-display" style="background: #eef6ff; padding:10px; border-radius:6px; border:1px solid var(--accent); font-weight:bold;">Tracez pour mesurer.</div>
                <input type="range" id="ratio-slider" min="0.5" max="10" step="0.5" value="3" style="width:100%; margin-top:10px;">
                <small>Densité : <span id="ratio-val">3</span> pers/m²</small>
            </div>

            <div class="card">
                <button class="btn btn-accent" onclick="exportAll()">Exporter Projet</button>
            </div>
        </aside>

        <main id="map">
            <div id="picto-box">
                <div class="picto-item" id="btn-crs" style="background:#0000FF" onclick="selectUnit(event, 'CRS')">CRS</div>
                <div class="picto-item" id="btn-gm" style="background:#5D4037" onclick="selectUnit(event, 'GM')">GM</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.9.3/src/leaflet.geometryutil.min.js"></script>

    <script>
        // --- CARTOGRAPHIE ---
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
        const map = L.map('map', { center: [48.8566, 2.3522], zoom: 15, layers: [satellite] });
        
        L.control.layers({ "Satellite": satellite, "Vue Allégée": light }).addTo(map);

        let layersData = [];
        let activeLayerId = null;
        let selectedUnitType = null;

        L.DomEvent.disableClickPropagation(document.getElementById('picto-box'));

        // --- GESTION DU ZOOM DYNAMIQUE ---
        // Cette fonction ajuste la taille visuelle de TOUS les marqueurs selon le zoom actuel
        function updateIconSizes() {
            const currentZoom = map.getZoom();
            // Facteur d'échelle : on définit que le zoom 15 est la taille 1 (normale)
            const scale = Math.pow(1.5, currentZoom - 15); 
            
            document.querySelectorAll('.unit-label-container').forEach(el => {
                el.style.transform = `scale(${scale})`;
            });
        }

        map.on('zoomend', updateIconSizes);

        // --- UNITÉS ---
        function selectUnit(event, type) {
            if (event) event.stopPropagation();
            selectedUnitType = type;
            document.querySelectorAll('.picto-item').forEach(el => el.classList.remove('picto-selected'));
            document.getElementById(`btn-${type.toLowerCase()}`).classList.add('picto-selected');
            map.getContainer().style.cursor = 'crosshair';
        }

        map.on('click', (e) => {
            if (!selectedUnitType) return;
            const name = prompt("Nom de l'unité ?", selectedUnitType);
            const time = prompt("Heure ?", new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}));
            
            if (name) {
                const color = (selectedUnitType === 'CRS') ? '#0000FF' : '#5D4037';
                
                // On crée l'icône
                const icon = L.divIcon({
                    className: 'custom-div-icon', // Classe vide pour éviter les styles par défaut
                    html: `
                        <div class="unit-label-container">
                            <div class="unit-box" style="background:${color}">${selectedUnitType}</div>
                            <div class="unit-info">${name}</div>
                            <div class="unit-info" style="color:#d35400">${time}</div>
                        </div>`,
                    iconSize: [100, 50],
                    iconAnchor: [50, 11]
                });

                const group = layersData.find(l => l.id === activeLayerId).group;
                const marker = L.marker(e.latlng, { icon: icon, draggable: true }).addTo(group);
                
                marker.on('contextmenu', () => { if(confirm("Supprimer ?")) group.removeLayer(marker); });
                
                // On force la mise à l'échelle immédiate du nouveau picto
                setTimeout(updateIconSizes, 10);
            }
            selectedUnitType = null;
            map.getContainer().style.cursor = '';
            document.querySelectorAll('.picto-item').forEach(el => el.classList.remove('picto-selected'));
        });

        // --- CALQUES & DESSIN (Même logique que précédemment) ---
        function addNewLayer(name) {
            const id = Date.now();
            const group = new L.FeatureGroup().addTo(map);
            layersData.push({ id, name, group, visible: true });
            setActiveLayer(id);
        }

        function setActiveLayer(id) {
            activeLayerId = id;
            updateUI();
        }

        function toggleVisibility(id, event) {
            event.stopPropagation();
            const layer = layersData.find(l => l.id === id);
            layer.visible = !layer.visible;
            if (layer.visible) map.addLayer(layer.group);
            else map.removeLayer(layer.group);
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = layersData.map(l => `
                <div class="layer-item ${l.id === activeLayerId ? 'layer-active' : ''}" onclick="setActiveLayer(${l.id})">
                    <span>${l.name}</span>
                    <i class="fa-solid ${l.visible ? 'fa-eye' : 'fa-eye-slash'}" onclick="toggleVisibility(${l.id}, event)"></i>
                </div>
            `).join('');
            
            if (window.dc) map.removeControl(window.dc);
            const g = layersData.find(l => l.id === activeLayerId).group;
            window.dc = new L.Control.Draw({ edit: { featureGroup: g }, draw: { marker:false, circle:false, circlemarker:false, polyline:true, polygon:true } });
            map.addControl(window.dc);
        }

        // --- RECHERCHE ---
        const sInput = document.getElementById('search-input');
        const sRes = document.getElementById('search-results');
        sInput.addEventListener('input', async () => {
            if (sInput.value.length < 3) { sRes.style.display='none'; return; }
            const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(sInput.value)}&limit=5`);
            const d = await r.json();
            sRes.innerHTML = d.features.map(f => `<div onclick="map.setView([${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], 18); sRes.style.display='none';" style="padding:10px; cursor:pointer; border-bottom:1px solid #eee;">${f.properties.label}</div>`).join('');
            sRes.style.display = 'block';
        });

        function promptNewLayer() { const n = prompt("Nom du calque :"); if(n) addNewLayer(n); }
        function exportAll() {
            let d = {}; layersData.forEach(l => d[l.name] = l.group.toGeoJSON());
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(d)], {type:'application/json'})); a.download = 'plan.json'; a.click();
        }

        addNewLayer("Secteur Principal");
    </script>
</body>
</html>
