<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographie Tactique - Fix Définitif</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        :root { --sidebar-bg: #f4f7f6; --panel-right-bg: #2c3e50; --accent: #3498db; }
        body { margin: 0; display: flex; font-family: 'Segoe UI', sans-serif; height: 100vh; background: #1a252f; overflow: hidden; }
        
        .sidebar { width: 300px; background: var(--sidebar-bg); display: flex; flex-direction: column; padding: 15px; z-index: 1000; border-right: 2px solid #bdc3c7; }
        #map { flex: 1; position: relative; }
        .right-panel { width: 280px; background: var(--panel-right-bg); color: white; padding: 15px; z-index: 1000; }

        /* BOUTON FLOTTANT DE VALIDATION */
        #draw-controls {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 2000; display: none; background: white; padding: 10px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 2px solid #2ecc71;
        }

        .box { background: white; border-radius: 8px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h3 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid #eee; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { cursor: pointer; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        
        .stat-line { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; }
        .stat-val { color: #f1c40f; font-weight: bold; }
        
        .layer-item { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; padding: 10px; cursor: pointer; position: relative; color: #333; }
        .layer-item.active { border: 2px solid var(--accent); background: #eef7fe; }
        .rename-btn { position: absolute; right: 8px; top: 8px; background: none; border: none; cursor: pointer; opacity: 0.5; }

        .area-tooltip { background: rgba(0,0,0,0.8); border: 1px solid #f1c40f; color: white; padding: 4px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div id="draw-controls">
    <button onclick="finishDrawing()" style="background:#2ecc71; color:white; border:none; padding:8px 20px; border-radius:20px; font-size:14px;">✅ VALIDER LE TRACÉ (Double-clic)</button>
    <button onclick="cancelDrawing()" style="background:#e74c3c; color:white; border:none; padding:8px 20px; border-radius:20px; font-size:14px; margin-left:10px;">❌ ANNULER</button>
</div>

<div class="sidebar">
    <div class="box">
        <h3>📍 Localisation</h3>
        <div id="search-container"></div>
    </div>

    <div class="box">
        <h3>📐 Mesures & Tracés</h3>
        <div class="btn-grid">
            <button onclick="startDraw('Polygon')" style="background: #e8f4fd;">⬢ Zone (m²)</button>
            <button onclick="startDraw('Polyline')" style="background: #e8f4fd;">📏 Ligne (m)</button>
        </div>
        <button id="editBtn" onclick="toggleEdit()" style="width:100%; margin-top:10px; background:#f39c12; color:white; border:none;">✏️ Mode Modification</button>
    </div>

    <div class="box">
        <h3>📊 Analyse</h3>
        <div id="stat-container">
            <div class="stat-line">Surface : <span id="area-val" class="stat-val">0</span> m²</div>
            <div class="stat-line">Capacité x3 : <span id="pers-3-val" class="stat-val" style="color:#2ecc71">0</span></div>
            <div class="stat-line">Capacité x4 : <span id="pers-4-val" class="stat-val" style="color:#e74c3c">0</span></div>
        </div>
    </div>

    <div class="box">
        <h3>🗂️ Calques</h3>
        <button onclick="createNewLayer()" style="width:100%; background:#3498db; color:white; border:none; padding:5px; border-radius:4px; margin-bottom:10px;">+ Nouveau Calque</button>
        <div id="layers-container"></div>
    </div>
</div>

<div id="map"></div>

<div class="right-panel">
    <div style="background:#34495e; padding:15px; border-radius:8px;">
        <h3 style="color:white; border-color:#5d6d7e;">💾 Export SIG</h3>
        <button onclick="exportToQGIS()" style="width:100%; background:#2ecc71; color:white; border:none; padding:12px; font-weight:bold; border-radius:4px;">📤 EXPORTER GEOJSON</button>
        <p style="font-size:11px; color:#bdc3c7; margin-top:10px;">Prêt pour QGIS : inclut le nom du calque et la surface.</p>
    </div>
    <br>
    <button onclick="resetAll()" style="width:100%; background:#c0392b; color:white; border:none; padding:8px; font-size:0.7rem; border-radius:4px;">⚠️ EFFACER TOUT</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script>
    const map = L.map('map', { center: [48.8566, 2.3522], zoom: 13 });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let layerGroups = {};
    let activeLayerId = null;
    let isEditing = false;
    let currentHandler = null;

    // --- LOGIQUE DE DESSIN ROBUSTE ---

    function startDraw(type) {
        if(!activeLayerId) return;
        if(isEditing) toggleEdit();
        if(currentHandler) currentHandler.disable();

        document.getElementById('draw-controls').style.display = 'block';

        if(type === 'Polygon') {
            currentHandler = new L.Draw.Polygon(map, { shapeOptions: { color: '#3498db', fillOpacity: 0.4 } });
        } else {
            currentHandler = new L.Draw.Polyline(map, { shapeOptions: { color: '#e74c3c' } });
        }
        currentHandler.enable();
    }

    function finishDrawing() {
        if(currentHandler) {
            // Force la fin du tracé
            if(currentHandler._poly && currentHandler._poly.getLatLngs().length > 0) {
                currentHandler.completeShape();
            }
            currentHandler.disable();
        }
        document.getElementById('draw-controls').style.display = 'none';
    }

    function cancelDrawing() {
        if(currentHandler) currentHandler.disable();
        document.getElementById('draw-controls').style.display = 'none';
    }

    map.on(L.Draw.Event.CREATED, function (e) {
        const layer = e.layer;
        layerGroups[activeLayerId].group.addLayer(layer);
        document.getElementById('draw-controls').style.display = 'none';
        
        updateStats(layer);
        layer.on('click', (ev) => { L.DomEvent.stopPropagation(ev); updateStats(layer); });
        saveData();
        renderLayersList();
    });

    // --- CALCULS & STATS ---

    function updateStats(layer) {
        if (layer instanceof L.Polygon) {
            const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
            document.getElementById('area-val').innerText = Math.round(area).toLocaleString();
            document.getElementById('pers-3-val').innerText = Math.round(area * 3).toLocaleString();
            document.getElementById('pers-4-val').innerText = Math.round(area * 4).toLocaleString();
            layer.bindTooltip(`<b>${Math.round(area)} m²</b>`, { permanent: true, direction: 'center', className: 'area-tooltip' }).openTooltip();
        }
    }

    // --- GESTION DES CALQUES ---

    function createNewLayer(name = "Nouveau Secteur", id = Date.now()) {
        const group = new L.FeatureGroup().addTo(map);
        layerGroups[id] = { group: group, name: name };
        activeLayerId = id;
        renderLayersList();
        saveData();
    }

    function renderLayersList() {
        const container = document.getElementById('layers-container');
        container.innerHTML = "";
        for (let id in layerGroups) {
            const div = document.createElement('div');
            div.className = `layer-item ${activeLayerId == id ? 'active' : ''}`;
            div.onclick = () => { activeLayerId = id; renderLayersList(); };
            div.innerHTML = `<strong>${layerGroups[id].name}</strong><br><small>${layerGroups[id].group.getLayers().length} objets</small>
            <button class="rename-btn" onclick="renameLayer('${id}', event)">✏️</button>`;
            container.appendChild(div);
        }
    }

    function renameLayer(id, e) {
        e.stopPropagation();
        const n = prompt("Nom :", layerGroups[id].name);
        if(n) { layerGroups[id].name = n; renderLayersList(); saveData(); }
    }

    function toggleEdit() {
        if(!activeLayerId) return;
        isEditing = !isEditing;
        const btn = document.getElementById('editBtn');
        layerGroups[activeLayerId].group.eachLayer(l => {
            if(l.editing) isEditing ? l.editing.enable() : l.editing.disable();
        });
        btn.innerText = isEditing ? "✅ Terminer" : "✏️ Mode Modification";
        btn.style.background = isEditing ? "#2ecc71" : "#f39c12";
        if(!isEditing) saveData();
    }

    // --- SAUVEGARDE & EXPORT ---

    function saveData() {
        const out = {};
        for(let id in layerGroups) {
            out[id] = { name: layerGroups[id].name, geojson: layerGroups[id].group.toGeoJSON() };
        }
        localStorage.setItem('map_tactique_final', JSON.stringify(out));
    }

    function loadData() {
        const saved = localStorage.getItem('map_tactique_final');
        if(!saved) return createNewLayer("Secteur Initial");
        const data = JSON.parse(saved);
        for(let id in data) {
            const group = new L.FeatureGroup().addTo(map);
            layerGroups[id] = { group: group, name: data[id].name };
            L.geoJSON(data[id].geojson).eachLayer(l => {
                group.addLayer(l);
                if(l instanceof L.Polygon) updateStats(l);
                l.on('click', (ev) => { L.DomEvent.stopPropagation(ev); updateStats(l); });
            });
        }
        activeLayerId = Object.keys(layerGroups)[0];
        renderLayersList();
    }

    function exportToQGIS() {
        const gj = layerGroups[activeLayerId].group.toGeoJSON();
        gj.features.forEach(f => { f.properties.calque = layerGroups[activeLayerId].name; });
        const blob = new Blob([JSON.stringify(gj)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${layerGroups[activeLayerId].name}.geojson`;
        a.click();
    }

    function resetAll() { if(confirm("Tout effacer ?")) { localStorage.clear(); location.reload(); } }

    L.GeometryUtil = {
        geodesicArea: function (latLngs) {
            var pointsCount = latLngs.length, area = 0.0, d2r = Math.PI / 180, p1, p2;
            for (var i = 0; i < pointsCount; i++) {
                p1 = latLngs[i]; p2 = latLngs[(i + 1) % pointsCount];
                area += ((p2.lng - p1.lng) * d2r) * (2 + Math.sin(p1.lat * d2r) + Math.sin(p2.lat * d2r));
            }
            return Math.abs(area * 6378137.0 * 6378137.0 / 2.0);
        }
    };

    const geocoder = L.Control.geocoder({ defaultMarkGeocode: false, collapsed: false })
        .on('markgeocode', e => { map.setView(e.geocode.center, 16); })
        .addTo(map);
    document.getElementById('search-container').appendChild(geocoder.getContainer());

    window.onload = loadData;
</script>
</body>
</html>
