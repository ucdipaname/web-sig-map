<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géo-Tactique V19 - Horodatage & Précision</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        :root { --sidebar-width: 320px; --accent: #0070F6; --dark: #1e272e; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: #f8f9fa; padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }
        
        /* Style des étiquettes de pictos */
        .tactical-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
        }
        .label-name { 
            background: rgba(255,255,255,0.9); 
            color: black; 
            font-weight: bold; 
            font-size: 11px; 
            padding: 0 4px; 
            border: 1px solid #666;
            border-bottom: none;
            border-radius: 3px 3px 0 0;
            white-space: nowrap;
        }
        .label-box {
            width: 55px;
            height: 22px;
            border: 2px solid black;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }
        .label-time {
            background: #333;
            color: #00ff00; /* Vert type digital pour l'heure */
            font-family: monospace;
            font-size: 10px;
            padding: 0 4px;
            border-radius: 0 0 3px 3px;
            border: 1px solid black;
            border-top: none;
        }

        .card { background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin-top: 5px; }
        .btn-accent { background: var(--accent); color: white; }
        #search-container { position: absolute; top: 10px; left: 50px; z-index: 1000; display: flex; gap: 5px; background: white; padding: 5px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #picto-box { position: absolute; bottom: 30px; right: 10px; background: white; padding: 10px; border-radius: 8px; border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
        .picto-btn { width: 65px; height: 35px; border: 1px solid black; color: white; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 style="margin:0 0 10px 0;">SÉCU-LOG V19</h2>
        
        <div class="card">
            <strong><i class="fa fa-ruler"></i> Mesures</strong>
            <div id="measure-output" style="font-size:0.85rem; color:#444; margin-top:5px;">Cliquez sur un tracé.</div>
        </div>

        <div class="card">
            <strong>Calques</strong>
            <div id="layers-list"></div>
            <button class="btn btn-accent" onclick="createNewLayer()">+ Nouveau</button>
        </div>

        <div class="card">
            <button class="btn" style="background:#27ae60; color:white;" onclick="exportProject()">Export SIG (.geojson)</button>
        </div>
    </aside>

    <div id="map">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Rechercher rue..." style="border:1px solid #ccc; padding:5px;">
            <button class="btn btn-accent" style="margin:0; width:40px;" onclick="searchAddress()"><i class="fa fa-search"></i></button>
        </div>

        <div id="picto-box">
            <div class="picto-btn" style="background:blue" onclick="prepareUnit('CRS')">CRS</div>
            <div class="picto-btn" style="background:#5D4037" onclick="prepareUnit('GM')">GM</div>
            <div class="picto-btn" style="background:red" onclick="prepareUnit('CIE')">CIE</div>
            <div class="picto-btn" style="background:green" onclick="prepareUnit('BRAV')">BRAV</div>
            <div class="picto-btn" style="background:#2c3e50" onclick="prepareUnit('POINT')">INFO</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const map = L.map('map', { center: [48.8566, 2.3522], zoom: 14, layers: [light] });
        L.control.layers({"Plan": light, "Satellite": satellite}, null, {position: 'topright'}).addTo(map);

        let projectLayers = [];
        let currentActiveId = null;
        let pendingUnit = null;

        async function searchAddress() {
            const q = document.getElementById('search-input').value;
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
            const d = await r.json();
            if(d[0]) map.setView([d[0].lat, d[0].lon], 17);
        }

        function createNewLayer(name = "Calque Tactique") {
            const group = new L.FeatureGroup().addTo(map);
            const id = "L-" + Date.now();
            projectLayers.push({ id, name, group });
            setActiveLayer(id);
            updateUI();
        }

        function setActiveLayer(id) {
            currentActiveId = id;
            const active = projectLayers.find(l => l.id === id);
            if (window.drawControl) map.removeControl(window.drawControl);
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: active.group },
                draw: { polygon: true, polyline: true, rectangle: true, marker: true, circle: false }
            });
            map.addControl(window.drawControl);
            updateUI();
        }

        // --- GESTION DES PICTOS ET ÉTIQUETTES ---
        function prepareUnit(type) { pendingUnit = type; map.getContainer().style.cursor = 'crosshair'; }

        map.on('click', (e) => {
            if (!pendingUnit) return;
            
            const uName = prompt("NOM de l'unité (ex: 4/7) :");
            if (!uName) { cancelPlacement(); return; }
            
            const uTime = prompt("HEURE (ex: 14:30) :", new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}));
            
            const colors = { CRS: 'blue', GM: '#5D4037', CIE: 'red', BRAV: 'green', POINT: '#2c3e50' };
            
            const html = `
                <div class="tactical-label">
                    <div class="label-name">${uName}</div>
                    <div class="label-box" style="background:${colors[pendingUnit]}">${pendingUnit}</div>
                    <div class="label-time">${uTime}</div>
                </div>
            `;

            const icon = L.divIcon({
                className: '',
                html: html,
                iconSize: [65, 60],
                iconAnchor: [32, 30] // ANCRAGE CENTRAL : [Largeur/2, Hauteur/2]
            });

            const marker = L.marker(e.latlng, { icon: icon, draggable: true });
            
            // Stockage propre pour export SIG
            marker.feature = { properties: { Nom: uName, Heure: uTime, Type: pendingUnit } };
            
            projectLayers.find(l => l.id === currentActiveId).group.addLayer(marker);
            cancelPlacement();
        });

        function cancelPlacement() { pendingUnit = null; map.getContainer().style.cursor = ''; }

        map.on('draw:created', (e) => {
            const layer = e.layer;
            projectLayers.find(l => l.id === currentActiveId).group.addLayer(layer);
            layer.on('click', () => {
                const gj = layer.toGeoJSON();
                if (layer instanceof L.Polygon) {
                    const area = Math.round(turf.area(gj));
                    document.getElementById('measure-output').innerHTML = `Surface: <b>${area} m²</b><br>Jauge (3p/m²): <b>${area*3} pers.</b>`;
                } else {
                    const len = Math.round(turf.length(gj, {units:'meters'}));
                    document.getElementById('measure-output').innerHTML = `Longueur: <b>${len} m</b>`;
                }
            });
        });

        function updateUI() {
            document.getElementById('layers-list').innerHTML = projectLayers.map(l => 
                `<div onclick="setActiveLayer('${l.id}')" style="padding:5px; cursor:pointer; ${l.id===currentActiveId?'background:#eef6ff; font-weight:bold; border-left:3px solid blue;':''}">${l.name}</div>`
            ).join('');
        }

        function exportProject() {
            const all = [];
            projectLayers.forEach(l => {
                const gj = l.group.toGeoJSON();
                gj.features.forEach(f => { f.properties.calque = l.name; all.push(f); });
            });
            const blob = new Blob([JSON.stringify({type:"FeatureCollection", features:all})], {type:"application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "plan_tactique_v19.geojson"; a.click();
        }

        createNewLayer("Secteur Principal");
    </script>
</body>
</html>
