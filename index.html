<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Sécurité Pro - Expert</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root { --sidebar-width: 350px; --accent: #0070F6; --dark: #1e272e; --light-grey: #F4F4F4; --success: #27ae60; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 0 20px; }
        .search-container { width: 60%; position: relative; }
        #search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; }
        #search-results { position: absolute; top: 55px; left: 0; right: 0; background: white; border-radius: 8px; z-index: 9999; max-height: 250px; overflow-y: auto; display: none; border: 1px solid #ccc; color: black; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: var(--light-grey); padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }

        /* Interface & Boutons */
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 8px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-accent { background: var(--accent); }
        .btn-fullscreen { background: #2c3e50; }
        .btn-export { background: var(--success); }

        /* Table Attributaire Style */
        .attr-table { font-size: 12px; border-collapse: collapse; width: 100%; min-width: 200px; margin-top: 5px; }
        .attr-table tr:nth-child(even) { background: #f8f9fa; }
        .attr-table td { border-bottom: 1px solid #eee; padding: 6px; color: #333; }
        .attr-table b { color: var(--accent); }

        /* Pictogrammes */
        #picto-box { position: absolute; bottom: 20px; right: 20px; background: white; padding: 12px; border-radius: 8px; border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .picto-item { width: 55px; height: 32px; color: white; border: 2px solid black; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* Cadre Export */
        #export-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1000px; height: 800px; border: 4px dashed #f39c12; z-index: 4000; pointer-events: none; display: none; box-shadow: 0 0 0 9999px rgba(0,0,0,0.4); }

        /* Unités sur carte */
        .unit-label-container { display: flex; flex-direction: column; align-items: center; }
        .unit-box { border: 2px solid black; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 45px; height: 22px; font-size: 10px; }
        .unit-info { background: rgba(255,255,255,0.9); border: 1px solid black; padding: 1px 4px; font-size: 9px; margin-top: 2px; font-weight: bold; color: black; white-space: nowrap; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher une adresse (ex: Place de la République)..." autocomplete="off">
            <div id="search-results"></div>
        </div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-desktop"></i> Affichage</h3>
                <button class="btn btn-fullscreen" onclick="toggleFullScreen()">
                    <i class="fa-solid fa-expand"></i> Mode Plein Écran
                </button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-file-import"></i> Import Données SIG</h3>
                <p style="font-size: 0.8rem; color: #666;">Importez un <b>CSV</b> (avec colonnes lat/lon) ou un <b>Shapefile (.zip)</b>.</p>
                <label class="btn btn-accent" style="cursor:pointer;">
                    <i class="fa-solid fa-upload"></i> Charger CSV ou SHP (.zip)
                    <input type="file" id="sig-import" style="display:none" accept=".csv, .zip">
                </label>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-camera"></i> Export HD</h3>
                <button class="btn" style="background:#f39c12" onclick="toggleFrame()">Visualiser Cadre 80x100</button>
                <button class="btn btn-export" onclick="exportToImage()">Exporter l'image finale</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Calques de travail</h3>
                <div id="layers-list"></div>
                <button class="btn btn-accent" onclick="promptNewLayer()">+ Nouveau Calque</button>
            </div>
        </aside>

        <main id="map">
            <div id="export-frame"></div>
            <div id="picto-box">
                <div class="picto-item" style="background:blue" onclick="selectUnit(event, 'CRS')">CRS</div>
                <div class="picto-item" style="background:#5D4037" onclick="selectUnit(event, 'GM')">GM</div>
                <div class="picto-item" style="background:red; border-radius:50%" onclick="selectUnit(event, 'CIE')">CIE</div>
                <div class="picto-item" style="background:green; transform:rotate(45deg)" onclick="selectUnit(event, 'BRAV')"><span style="transform:rotate(-45deg)">BRAV</span></div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

    <script>
        // --- INITIALISATION CARTE ---
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { crossOrigin: 'Anonymous' });
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { crossOrigin: 'Anonymous' });
        
        const map = L.map('map', { 
            center: [48.8566, 2.3522], 
            zoom: 13, 
            layers: [satellite] 
        });

        L.control.layers({ "Satellite": satellite, "Plan": osm }).addTo(map);

        let layersData = [];
        let activeLayerId = null;
        let selectedUnitType = null;

        // --- FONCTIONS TABLE ATTRIBUTAIRE ---
        function createAttrTable(props) {
            let table = `<table class="attr-table">`;
            for (let key in props) {
                if (props[key] && typeof props[key] !== 'object') {
                    table += `<tr><td><b>${key}</b></td><td>${props[key]}</td></tr>`;
                }
            }
            return table + `</table>`;
        }

        // --- GESTION DU PLEIN ÉCRAN ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // --- IMPORT CSV & SHAPEFILE ---
        document.getElementById('sig-import').onchange = function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            const group = layersData.find(l => l.id === activeLayerId).group;

            reader.onload = async (ev) => {
                // CAS CSV
                if (file.name.endsWith('.csv')) {
                    const text = ev.target.result;
                    const lines = text.split(/\r?\n/);
                    const sep = text.includes(';') ? ';' : ',';
                    const headers = lines[0].split(sep).map(h => h.trim());
                    
                    const latIdx = headers.findIndex(h => h.toLowerCase().match(/lat|latitude/));
                    const lngIdx = headers.findIndex(h => h.toLowerCase().match(/lon|lng|longitude/));

                    if(latIdx === -1 || lngIdx === -1) {
                        alert("Colonnes Latitude/Longitude non trouvées.");
                        return;
                    }

                    lines.slice(1).forEach(line => {
                        const cols = line.split(sep);
                        if (cols.length > latIdx && !isNaN(parseFloat(cols[latIdx]))) {
                            let props = {};
                            headers.forEach((h, i) => { props[h] = cols[i]; });
                            L.marker([parseFloat(cols[latIdx]), parseFloat(cols[lngIdx])])
                             .addTo(group)
                             .bindPopup(createAttrTable(props));
                        }
                    });
                } 
                // CAS SHAPEFILE (ZIP)
                else if (file.name.endsWith('.zip')) {
                    try {
                        const geo = await shp(ev.target.result);
                        L.geoJSON(geo, {
                            onEachFeature: (feature, layer) => {
                                if (feature.properties) layer.bindPopup(createAttrTable(feature.properties));
                            }
                        }).addTo(group);
                    } catch (err) {
                        alert("Erreur Shapefile : vérifiez que le .zip contient .shp, .dbf et .shx");
                    }
                }
            };

            if(file.name.endsWith('.zip')) reader.readAsArrayBuffer(file);
            else reader.readAsText(file);
        };

        // --- GESTION DES CALQUES ---
        function addNewLayer(name) {
            const id = Date.now();
            const group = new L.FeatureGroup().addTo(map);
            layersData.push({ id, name, group, visible: true });
            setActiveLayer(id);
        }

        function setActiveLayer(id) {
            activeLayerId = id;
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = layersData.map(l => `
                <div class="layer-item" style="padding:8px; border:1px solid #ccc; margin-top:5px; cursor:pointer; background:${l.id === activeLayerId ? '#e3f2fd' : 'white'}">
                    <span onclick="setActiveLayer(${l.id})">${l.name}</span>
                </div>
            `).join('');
            
            // Update Draw Control
            if (window.drawControl) map.removeControl(window.drawControl);
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: activeGroup },
                draw: { circle:false, marker:false, circlemarker:false }
            });
            map.addControl(window.drawControl);
        }

        // --- EXPORT IMAGE ---
        function toggleFrame() {
            const f = document.getElementById('export-frame');
            f.style.display = (f.style.display === 'block') ? 'none' : 'block';
        }

        function exportToImage() {
            document.getElementById('export-frame').style.display = 'none';
            html2canvas(document.getElementById('map'), { useCORS: true, scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'plan_intervention.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }

        // --- RECHERCHE ADRESSE ---
        document.getElementById('search-input').oninput = async function() {
            if(this.value.length < 3) return;
            const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(this.value)}&limit=5`);
            const d = await r.json();
            const res = document.getElementById('search-results');
            res.innerHTML = d.features.map(f => `<div onclick="map.setView([${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}], 18); document.getElementById('search-results').style.display='none';" style="padding:10px; cursor:pointer; border-bottom:1px solid #eee;">${f.properties.label}</div>`).join('');
            res.style.display = 'block';
        };

        function promptNewLayer() { let n = prompt("Nom du calque ?"); if(n) addNewLayer(n); }
        
        // Init
        addNewLayer("Secteur Principal");
    </script>
</body>
</html>
