<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartographie Tactique - Correctif Dessin</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        :root { --sidebar-bg: #f4f7f6; --panel-right-bg: #2c3e50; --accent: #3498db; }
        body { margin: 0; display: flex; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; background: #1a252f; overflow: hidden; }
        
        .sidebar { width: 300px; background: var(--sidebar-bg); display: flex; flex-direction: column; padding: 15px; z-index: 1000; border-right: 2px solid #bdc3c7; overflow-y: auto; }
        #map { flex: 1; }
        .right-panel { width: 280px; background: var(--panel-right-bg); color: white; padding: 15px; z-index: 1000; border-left: 2px solid #34495e; overflow-y: auto; }

        .box { background: white; border-radius: 8px; padding: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333; }
        .box-dark { background: #34495e; color: white; border: 1px solid #455a64; margin-bottom: 15px; border-radius: 8px; padding: 12px; }
        h3 { margin: 0 0 12px 0; font-size: 0.8rem; color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { cursor: pointer; padding: 10px; border: 1px solid #bdc3c7; background: #fff; border-radius: 4px; font-weight: bold; font-size: 0.75rem; transition: 0.2s; }
        
        .export-btn { background: #2ecc71; color: white; border: none; width: 100%; padding: 12px; font-size: 0.9rem; margin-top: 10px; }
        .file-label { display: block; background: #5d6d7e; color: white; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-top: 8px; }

        .stat-line { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; }
        .stat-val { color: #f1c40f; font-weight: bold; }
        
        .layer-item { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; padding: 10px; cursor: pointer; color: #2c3e50; position: relative; }
        .layer-item.active { border: 2px solid var(--accent); background: #eef7fe; }
        .rename-btn { position: absolute; right: 10px; top: 10px; background: none; border: none; cursor: pointer; }

        .area-tooltip { background: rgba(0, 0, 0, 0.8) !important; border: 1px solid #f1c40f !important; color: white !important; font-weight: bold !important; padding: 5px !important; border-radius: 4px !important; }

        @media print { .sidebar, .right-panel, .leaflet-control-container { display: none !important; } #map { width: 100vw !important; height: 100vh !important; } }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="box">
        <h3>📍 Localisation</h3>
        <div id="search-container"></div>
    </div>

    <div class="box">
        <h3>📐 Mesures & Tracés</h3>
        <div class="btn-grid">
            <button id="drawPolyBtn" onclick="startDraw('Polygon')" style="background: #e8f4fd;">⬢ Zone (m²)</button>
            <button id="drawLineBtn" onclick="startDraw('Polyline')" style="background: #e8f4fd;">📏 Ligne (m)</button>
        </div>
        <button id="editBtn" onclick="toggleEdit()" style="width:100%; margin-top:10px; background:#f39c12; color:white; border:none; border-radius:4px; font-weight:bold;">✏️ Modifier les tracés</button>
    </div>

    <div class="box">
        <h3>📊 Analyse Sélection</h3>
        <div id="stat-container">
            <div class="stat-line">Surface : <span id="area-val" class="stat-val">0</span> m²</div>
            <div class="stat-line" style="border-top:1px solid #eee; padding-top:5px; margin-top:5px;">Capacité x3 : <span id="pers-3-val" class="stat-val" style="color:#2ecc71">0</span></div>
            <div class="stat-line">Capacité x4 : <span id="pers-4-val" class="stat-val" style="color:#e74c3c">0</span></div>
        </div>
    </div>

    <div class="box">
        <h3>🗂️ Calques</h3>
        <button onclick="createNewLayer()" style="width:100%; background:#3498db; color:white; border:none; padding:8px; border-radius:4px; margin-bottom:10px;">+ Nouveau Calque</button>
        <div id="layers-container"></div>
    </div>
</div>

<div id="map"></div>

<div class="right-panel">
    <div class="box-dark">
        <h3>💾 Export QGIS</h3>
        <button class="export-btn" onclick="exportToQGIS()">📤 Exporter (.geojson)</button>
    </div>
    <div class="box-dark">
        <h3>📥 Import SIG</h3>
        <label class="file-label">📂 Shapefile (.zip) <input type="file" accept=".zip" onchange="importShapefile(this)" style="display:none;"></label>
        <label class="file-label">📊 Fichier CSV <input type="file" accept=".csv" onchange="importCSV(this)" style="display:none;"></label>
    </div>
    <div class="box-dark">
        <h3>⚙️ Outils Projet</h3>
        <button onclick="window.print()" style="width:100%; background:#ecf0f1; color:#2c3e50; border:none; padding:10px; font-weight:bold;">🖨️ PDF Rapport</button>
        <button onclick="resetAll()" style="width:100%; background:#c0392b; color:white; border:none; padding:5px; margin-top:20px; font-size:0.7rem;">⚠️ Réinitialiser tout</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

<script>
    const osm = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
    const map = L.map('map', { center: [48.8566, 2.3522], zoom: 13, layers: [osm] });
    L.control.layers({ "Plan": osm, "Satellite": satellite }, null, { position: 'topright' }).addTo(map);

    let layerGroups = {};
    let activeLayerId = null;
    let isEditing = false;
    let currentDrawer = null;

    // --- GEOMETRY UTIL ---
    L.GeometryUtil = {
        geodesicArea: function (latLngs) {
            var pointsCount = latLngs.length, area = 0.0, d2r = Math.PI / 180, p1, p2;
            if (pointsCount > 2) {
                for (var i = 0; i < pointsCount; i++) {
                    p1 = latLngs[i]; p2 = latLngs[(i + 1) % pointsCount];
                    area += ((p2.lng - p1.lng) * d2r) * (2 + Math.sin(p1.lat * d2r) + Math.sin(p2.lat * d2r));
                }
                area = area * 6378137.0 * 6378137.0 / 2.0;
            }
            return Math.abs(area);
        }
    };

    // --- LOGIQUE DE DESSIN ---
    function startDraw(type) {
        if(!activeLayerId) return alert("Sélectionnez un calque.");
        if(isEditing) toggleEdit(); // Désactive l'édition si active
        
        // Annule un tracé en cours si on reclique sur un bouton
        if(currentDrawer) currentDrawer.disable();

        if(type === 'Polygon') {
            currentDrawer = new L.Draw.Polygon(map, { shapeOptions: { color: '#3498db', fillOpacity: 0.4, weight: 3 } });
        } else {
            currentDrawer = new L.Draw.Polyline(map, { shapeOptions: { color: '#e74c3c', weight: 4 } });
        }
        currentDrawer.enable();
    }

    // Événement déclenché à la fin du tracé (double-clic)
    map.on(L.Draw.Event.CREATED, function (e) {
        const layer = e.layer;
        layerGroups[activeLayerId].group.addLayer(layer);
        
        updateStatsBox(layer);
        
        layer.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            updateStatsBox(layer);
        });

        currentDrawer = null; // Libère le drawer
        saveProject();
        renderLayers();
    });

    function toggleEdit() {
        if (!activeLayerId) return;
        isEditing = !isEditing;
        const btn = document.getElementById('editBtn');
        const group = layerGroups[activeLayerId].group;

        group.eachLayer(l => {
            if (l.editing) {
                if (isEditing) l.editing.enable();
                else {
                    l.editing.disable();
                    updateStatsBox(l);
                }
            }
        });

        btn.innerText = isEditing ? "✅ Terminer la modification" : "✏️ Modifier les tracés";
        btn.style.background = isEditing ? "#2ecc71" : "#f39c12";
        if (!isEditing) saveProject();
    }

    function updateStatsBox(layer) {
        if (layer instanceof L.Polygon) {
            const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
            document.getElementById('area-val').innerText = Math.round(area).toLocaleString();
            document.getElementById('pers-3-val').innerText = Math.round(area * 3).toLocaleString();
            document.getElementById('pers-4-val').innerText = Math.round(area * 4).toLocaleString();
            layer.bindTooltip(`<b>${Math.round(area)} m²</b>`, { permanent: true, direction: 'center', className: 'area-tooltip' }).openTooltip();
        }
    }

    // --- GESTION PROJET & SAUVEGARDE ---
    function saveProject() {
        const data = {};
        for (let id in layerGroups) {
            data[id] = { name: layerGroups[id].name, geojson: layerGroups[id].group.toGeoJSON() };
        }
        localStorage.setItem('tactical_backup_v2', JSON.stringify(data));
    }

    function loadProject() {
        const saved = localStorage.getItem('tactical_backup_v2');
        if (!saved) return createNewLayer("Zone d'Opération");

        const data = JSON.parse(saved);
        for (let id in data) {
            const group = new L.FeatureGroup().addTo(map);
            layerGroups[id] = { group: group, name: data[id].name };
            L.geoJSON(data[id].geojson, {
                onEachFeature: (f, l) => {
                    group.addLayer(l);
                    if (l instanceof L.Polygon) updateStatsBox(l);
                    l.on('click', (ev) => { L.DomEvent.stopPropagation(ev); updateStatsBox(l); });
                }
            });
        }
        activeLayerId = Object.keys(layerGroups)[0];
        renderLayers();
    }

    function createNewLayer(name = "Secteur " + (Object.keys(layerGroups).length + 1), id = Date.now()) {
        const group = new L.FeatureGroup().addTo(map);
        layerGroups[id] = { group: group, name: name };
        activeLayerId = id;
        renderLayers();
        saveProject();
    }

    function renameLayer(id, event) {
        event.stopPropagation();
        const n = prompt("Nom du calque :", layerGroups[id].name);
        if (n) { layerGroups[id].name = n; renderLayers(); saveProject(); }
    }

    function renderLayers() {
        const container = document.getElementById('layers-container');
        container.innerHTML = "";
        for (let id in layerGroups) {
            const div = document.createElement('div');
            div.className = `layer-item ${activeLayerId == id ? 'active' : ''}`;
            div.onclick = () => { activeLayerId = id; renderLayers(); };
            div.innerHTML = `<strong>${layerGroups[id].name}</strong><br><small>${layerGroups[id].group.getLayers().length} objets</small>
            <button class="rename-btn" onclick="renameLayer('${id}', event)">✏️</button>`;
            container.appendChild(div);
        }
    }

    // --- EXPORT / IMPORT ---
    function exportToQGIS() {
        const collection = { type: "FeatureCollection", features: [] };
        layerGroups[activeLayerId].group.eachLayer(l => {
            let gj = l.toGeoJSON();
            gj.properties = { calque: layerGroups[activeLayerId].name };
            collection.features.push(gj);
        });
        const blob = new Blob([JSON.stringify(collection)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${layerGroups[activeLayerId].name}.geojson`;
        a.click();
    }

    function importShapefile(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            shp(e.target.result).then(function(geojson) {
                const lyr = L.geoJSON(geojson, { onEachFeature: (f, l) => { 
                    layerGroups[activeLayerId].group.addLayer(l); 
                    if (l instanceof L.Polygon) updateStatsBox(l);
                } });
                map.fitBounds(lyr.getBounds());
                saveProject(); renderLayers();
            });
        };
        reader.readAsArrayBuffer(file);
    }

    function importCSV(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const lines = e.target.result.split('\n');
            lines.forEach((line, i) => {
                if (i === 0) return;
                const c = line.split(',');
                if (c.length >= 2) {
                    const lat = parseFloat(c[0]), lon = parseFloat(c[1]);
                    if (!isNaN(lat)) L.marker([lat, lon]).addTo(layerGroups[activeLayerId].group);
                }
            });
            saveProject(); renderLayers();
        };
        reader.readAsText(file);
    }

    function resetAll() {
        if(confirm("Effacer tout le projet ?")) { localStorage.removeItem('tactical_backup_v2'); location.reload(); }
    }

    // Geocoder
    const geocoder = L.Control.geocoder({ defaultMarkGeocode: false, collapsed: false })
        .on('markgeocode', e => { map.setView(e.geocode.center, 16); L.marker(e.geocode.center).addTo(map); })
        .addTo(map);
    document.getElementById('search-container').appendChild(geocoder.getContainer());

    window.onload = loadProject;
</script>
</body>
</html>
