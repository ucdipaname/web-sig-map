<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Géo-Tactique V30 – Commandement Collaboratif</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
:root { --sidebar-width:300px; --accent:#0070F6; }
body { margin:0; display:flex; height:100vh; font-family:Segoe UI; }
body.dark-mode { background:#111; color:#ddd; }
body.dark-mode #sidebar{ background:#1a1a1a; color:#ddd; border-right:1px solid #333;}
body.dark-mode .card{ background:#222; border:1px solid #333;}
body.dark-mode #map{ filter: brightness(0.85) contrast(1.1); }

#sidebar{ width:var(--sidebar-width); background:#f8f9fa; border-right:1px solid #ddd; padding:15px; display:flex; flex-direction:column; z-index:1000; }

#map{ flex:1; position:relative; }

.card{ background:white; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px; }
.btn{ width:100%; padding:8px; margin-top:5px; cursor:pointer; font-weight:bold; border-radius:4px; border:1px solid #ccc; }
.btn-blue{ background:var(--accent); color:white; border:none; }

#topbar{ position:absolute; top:0; left:0; right:0; height:35px; background:#000; color:#0f0; display:flex; align-items:center; justify-content:center; font-weight:bold; letter-spacing:1px; z-index:2000; }
.search-bar{ position:absolute; top:45px; left:50px; z-index:1000; display:flex; gap:5px; }
#search-input{ padding:8px; width:200px; border-radius:4px; border:1px solid #ccc; }

.tactical-tag{ width:90px; height:65px; display:flex; flex-direction:column; align-items:center; }
.t-name{ background:white; border:1px solid #000; font-size:10px; font-weight:bold; padding:1px 3px; border-radius:3px 3px 0 0; }
.t-box{ width:60px; height:20px; border:2px solid #000; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:11px; margin-top:-1px; }
.t-time{ background:#222; color:#0f0; font-family:monospace; font-size:9px; padding:1px 3px; border:1px solid #000; border-radius:0 0 3px 3px; margin-top:-1px; }
.selected-marker .t-box{ box-shadow:0 0 8px 3px rgba(0,120,255,0.7);}
.t-arrow{ font-size:14px; margin-top:-3px; transform-origin:center; cursor:pointer; }

#picto-box{ position:absolute; bottom:20px; right:20px; background:white; padding:10px; display:flex; flex-direction:column; gap:5px; border:2px solid #333; border-radius:8px; z-index:2000; }
.p-btn{ width:60px; height:30px; color:white; border:1px solid #000; cursor:pointer; font-size:10px; font-weight:bold; display:flex; align-items:center; justify-content:center; }
</style>
</head>

<body>
<aside id="sidebar">
<h2>GÉO-Tactique V30</h2>

<div class="card"><strong>Mesure</strong>
<div id="stats" style="font-size:0.85rem;color:#666;">Tracez une zone.</div></div>

<div class="card"><strong>Calques</strong>
<div id="layer-list"></div>
<button class="btn btn-blue" onclick="addLayer()">+ Nouveau Calque</button></div>

<div class="card"><strong>Forces engagées</strong>
<div id="force-stats">CRS : 0<br>GM : 0<br>CIE : 0<br>INFO : 0</div></div>

<div class="card"><strong>Journal</strong>
<div id="event-log" style="max-height:150px; overflow:auto; font-size:12px;"></div></div>

<button class="btn" onclick="toggleDark()">Mode Nuit</button>
<button class="btn" onclick="toggleLock()">Mode Briefing</button>
<button class="btn" onclick="activateLink()">Lier unités</button>
<button class="btn" onclick="exportGeoJSON()">Exporter GeoJSON</button>
</aside>

<div id="topbar">CENTRE OPÉRATIONNEL – GÉO-TACTIQUE V30</div>

<div id="map">
<div class="search-bar">
<input type="text" id="search-input" placeholder="Rechercher une rue...">
<button class="btn btn-blue" style="margin:0;" onclick="search()">OK</button>
</div>

<div id="picto-box">
<div class="p-btn" style="background:blue;" onclick="setMode('CRS')">CRS</div>
<div class="p-btn" style="background:#5D4037;" onclick="setMode('GM')">GM</div>
<div class="p-btn" style="background:red;" onclick="setMode('CIE')">CIE</div>
<div class="p-btn" style="background:#2c3e50;" onclick="setMode('INFO')">INFO</div>
</div>
</div>

<script>
// Carte
const map=L.map('map').setView([48.8566,2.3522],13);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const osmLight=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
L.control.layers({"OSM":osm,"OSM Clair":osmLight,"Satellite":sat}).addTo(map);

// Variables
let layers=[], activeLayer=null, modePicto=null;
let forceCount={CRS:0, GM:0, CIE:0, INFO:0};
let eventLog=[], selectedUnit=null, linkMode=false, firstUnit=null;
let locked=false;

// Calques
function addLayer(name="Zone "+(layers.length+1)){
  const group=new L.FeatureGroup().addTo(map);
  const id=Date.now();
  layers.push({id,name,group});
  selectLayer(id);
}
function selectLayer(id){
  activeLayer=layers.find(l=>l.id===id);
  updateUI();
}
function updateUI(){
  const list=document.getElementById('layer-list');
  list.innerHTML=layers.map(l=>`
  <div onclick="selectLayer(${l.id})"
  style="padding:5px;cursor:pointer;margin-bottom:2px;border-radius:3px;border:1px solid #ddd;
  ${activeLayer.id===l.id?'background:#e7f1ff;border-color:#0070F6;':''}">${l.name}</div>`).join('');
}

// Recherche
async function search(){
  const val=document.getElementById('search-input').value;
  const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${val}`);
  const data=await res.json();
  if(data[0]) map.setView([data[0].lat,data[0].lon],17);
}

// Mode sombre
function toggleDark(){ document.body.classList.toggle("dark-mode"); }

// Mode briefing
function toggleLock(){
  locked=!locked;
  if(locked){
    map.dragging.disable(); map.doubleClickZoom.disable(); map.scrollWheelZoom.disable();
    document.querySelectorAll('.leaflet-marker-icon').forEach(el=>el.style.pointerEvents="none");
  } else{
    map.dragging.enable(); map.doubleClickZoom.enable(); map.scrollWheelZoom.enable();
    document.querySelectorAll('.leaflet-marker-icon').forEach(el=>el.style.pointerEvents="auto");
  }
}

// Lier unités
function activateLink(){ linkMode=true; alert("Cliquez sur deux unités pour créer liaison."); }

// Forces
function updateForces(){
  document.getElementById("force-stats").innerHTML = `CRS : ${forceCount.CRS}<br>GM : ${forceCount.GM}<br>CIE : ${forceCount.CIE}<br>INFO : ${forceCount.INFO}`;
}

// Journal
function logEvent(text){
  const time=new Date().toLocaleTimeString();
  eventLog.push("["+time+"] "+text);
  document.getElementById("event-log").innerHTML = eventLog.slice(-20).join("<br>");
}

// Picto
function setMode(type){ modePicto=type; map.getContainer().style.cursor='crosshair'; }
function getTime(){ const d=new Date(); return d.getHours()+":"+String(d.getMinutes()).padStart(2,'0'); }

// Marker click
map.on('click', function(e){
  if(selectedUnit && !modePicto){
    moveUnit(selectedUnit, e.latlng);
    selectedUnit=null;
    return;
  }
  if(!modePicto || !activeLayer) return;

  const name=prompt("Nom unité :"); if(!name){modePicto=null;return;}
  const radius=prompt("Rayon (mètres) optionnel :"); 
  const colors={CRS:'blue',GM:'#5D4037',CIE:'red',INFO:'#2c3e50'};

  const html=`<div class="tactical-tag"><div class="t-name">${name}</div>
  <div class="t-box" style="background:${colors[modePicto]}">${modePicto}</div>
  <div class="t-time">${getTime()}</div><div class="t-arrow">▲</div></div>`;

  const marker=L.marker(e.latlng,{icon:L.divIcon({className:'',html:html,iconSize:[90,65],iconAnchor:[45,65]}),draggable:true}).addTo(activeLayer.group);

  // Halo sélection
  marker.on('click', function(){
    if(linkMode){
      if(!firstUnit){ firstUnit=marker; return;}
      L.polyline([firstUnit.getLatLng(), marker.getLatLng()],{color:'yellow',weight:2,dashArray:'5,5'}).addTo(map);
      logEvent("Liaison créée");
      linkMode=false; firstUnit=null; return;
    }
    selectedUnit=marker;
    document.querySelectorAll('.selected-marker').forEach(el=>el.classList.remove('selected-marker'));
    marker.getElement().classList.add('selected-marker');
  });

  // Radar
  if(radius && !isNaN(radius)){
    const circle=L.circle(e.latlng,{radius:Number(radius),color:colors[modePicto],fillOpacity:0.05,weight:1}).addTo(activeLayer.group);
    marker.on('drag',()=>circle.setLatLng(marker.getLatLng()));
  }

  // Forces
  forceCount[modePicto]++; updateForces();

  // Journal
  logEvent(`Unité ${modePicto} "${name}" ajoutée`);

  modePicto=null; map.getContainer().style.cursor='';
});

// Déplacement animé
function moveUnit(marker,dest){
  const start=marker.getLatLng(); const steps=50; let i=0;
  const interval=setInterval(()=>{
    i++; const lat=start.lat+(dest.lat-start.lat)*(i/steps);
    const lng=start.lng+(dest.lng-start.lng)*(i/steps);
    marker.setLatLng([lat,lng]);
    if(i>=steps){ clearInterval(interval); logEvent("Unité déplacée"); saveState(); }
  },20);
}

// Sauvegarde locale simple
function saveState(){
  const data=[]; map.eachLayer(layer=>{
    if(layer instanceof L.Marker){
      data.push({lat:layer.getLatLng().lat,lng:layer.getLatLng().lng});
    }
  });
  localStorage.setItem("geoTactiqueSave", JSON.stringify(data));
}

// Export GeoJSON
function exportGeoJSON(){
  if(!activeLayer) return;
  const data=activeLayer.group.toGeoJSON();
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='plan_tactique.geojson'; a.click();
}

// Initialisation
addLayer("Secteur 1");

</script>
</body>
</html>
