<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paris Geo Pro - Force Click Fix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <style>
        /* Reset total pour éviter les overlays fantômes */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            overflow: hidden; 
            background: #000; 
        }

        #sidebar { 
            width: 300px; 
            height: 100vh;
            background: #1a1c23; 
            color: white; 
            z-index: 9999; /* Priorité maximale pour le menu */
            position: relative;
            flex-shrink: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        #map-container {
            flex-grow: 1;
            position: relative;
            height: 100vh;
            z-index: 1;
        }

        #map { 
            width: 100%;
            height: 100%;
            /* Force la réception des clics */
            pointer-events: auto !important; 
            z-index: 5;
        }

        /* Correction spécifique pour les bugs de calques Chrome */
        .leaflet-pane { z-index: 400 !important; }
        .leaflet-top, .leaflet-bottom { z-index: 1000 !important; }

        .btn { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 10px; 
            cursor: pointer; 
            background: #3498db; 
            color: white; 
            border: none; 
            border-radius: 4px; 
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="font-size: 1.2rem;">Paris Geo Pro</h2>
    <button class="btn" onclick="map.locate({setView: true, maxZoom: 16})">🎯 Ma Position</button>
    <button class="btn" style="background:#8e44ad" onclick="activateText()">🔤 Outil Texte</button>
    <div id="status" style="font-size: 0.8rem; color: #2ecc71;">Carte prête</div>
</div>

<div id="map-container">
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    // 1. Initialisation avec focus forcé
    const map = L.map('map', {
        tap: false, // Désactive la gestion spécifique au tactile qui peut bugger sur Chrome desktop
        zoomControl: true
    }).setView([48.8588, 2.347], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const drawnItems = new L.FeatureGroup().addTo(map);

    // 2. Ajout des outils de dessin
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: { marker: true, polyline: true, polygon: true, rectangle: true, circle: true }
    });
    map.addControl(drawControl);

    // 3. Force le Focus au démarrage
    window.onload = function() {
        setTimeout(() => {
            map.invalidateSize(); // Recalcule la taille de la carte
            document.getElementById('map').focus();
            console.log("Focus carte forcé");
        }, 500);
    };

    // 4. Gestion du dessin
    map.on(L.Draw.Event.CREATED, function (e) {
        drawnItems.addLayer(e.layer);
        document.getElementById('status').innerText = "Élément ajouté";
    });

    // 5. Outil Texte
    let textMode = false;
    function activateText() {
        textMode = true;
        document.getElementById('status').innerText = "Cliquez sur la carte...";
    }

    map.on('click', function(e) {
        if(!textMode) return;
        const val = prompt("Texte :");
        if(val) {
            L.marker(e.latlng, {
                icon: L.divIcon({
                    className: 'txt-lbl',
                    html: `<b style="background:white; padding:3px; border:1px solid #000;">${val}</b>`,
                    iconSize: null
                })
            }).addTo(drawnItems);
        }
        textMode = false;
        document.getElementById('status').innerText = "Carte prête";
    });

</script>
</body>
</html>
