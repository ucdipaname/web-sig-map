<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Expert - Drag & Drop & Recalcul</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root { --sidebar-width: 340px; --accent: #0070F6; --dark: #1e272e; --light-grey: #F4F4F4; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 0 20px; }
        .search-container { width: 60%; position: relative; }
        #search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; }
        
        #container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: var(--light-grey); padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }

        /* Boîte Pictos Drag & Drop */
        #picto-box { 
            position: absolute; bottom: 20px; right: 20px; 
            background: white; padding: 12px; border-radius: 8px; 
            border: 2px solid var(--dark); z-index: 1000;
            display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .picto-item { 
            width: 60px; height: 35px; color: white; border: 2px solid black; 
            font-weight: bold; font-size: 11px; display: flex; align-items: center; 
            justify-content: center; cursor: grab; user-select: none;
        }
        .picto-crs { background: #0000FF; }
        .picto-gm { background: #5D4037; } /* Marron GM */

        /* Étiquettes sur carte */
        .unit-label {
            background: rgba(255,255,255,0.9); border: 1px solid #333;
            padding: 2px 5px; border-radius: 3px; font-size: 10px;
            white-space: nowrap; box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            pointer-events: none;
        }
        .unit-connector {
            width: 1px; background: black; position: absolute; transform-origin: top;
        }

        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #eee; }
        .info-box { background: #f9f9f9; padding: 10px; border-radius: 6px; font-size: 0.9rem; margin-top: 10px; border: 1px solid #ddd; font-weight: bold; }
        .btn { width: 100%; padding: 12px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher une adresse..." autocomplete="off">
        </div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Calques</h3>
                <div id="layers-list"></div>
                <button onclick="addNewLayer()" style="width:100%; margin-top:5px;">+ Nouveau Calque</button>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-ruler-combined"></i> Mesures</h3>
                <div id="measure-display" class="info-box">Aucune zone.</div>
            </div>
            <div class="card">
                <h3><i class="fa-solid fa-people-group"></i> Densité</h3>
                <input type="range" id="ratio-slider" min="0.5" max="10" step="0.5" value="3" style="width:100%">
                <div style="text-align:center;"><span id="ratio-val">3</span> pers / m²</div>
            </div>
        </aside>

        <main id="map" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
            <div id="picto-box">
                <div style="font-size: 9px; font-weight: bold; text-align: center;">DRAG & DROP</div>
                <div class="picto-item picto-crs" draggable="true" ondragstart="event.dataTransfer.setData('type','CRS')">CRS</div>
                <div class="picto-item picto-gm" draggable="true" ondragstart="event.dataTransfer.setData('type','GM')">GM</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.9.3/src/leaflet.geometryutil.min.js"></script>

    <script>
        // --- CARTOGRAPHIE & VUES ---
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');

        const map = L.map('map', { center: [46.6, 2.2], zoom: 6, layers: [satellite] });
        L.control.layers({ "Satellite": satellite, "Plan OSM": osm, "Vue Allégée": light }).addTo(map);

        let layersData = [];
        let activeLayerId = null;
        let currentRatio = 3;

        // --- GESTION DES CALQUES ---
        function addNewLayer(name = null) {
            const id = Date.now();
            const group = new L.FeatureGroup().addTo(map);
            layersData.push({ id, name: name || `Calque ${layersData.length+1}`, group });
            activeLayerId = id;
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = layersData.map(l => `
                <div style="font-size:12px; padding:5px; background:${l.id===activeLayerId?'#ddd':'none'}">
                    <input type="radio" name="layer" ${l.id===activeLayerId?'checked':''} onclick="activeLayerId=${l.id}; updateDraw();"> ${l.name}
                </div>
            `).join('');
            updateDraw();
        }

        // --- RECALCUL SURFACE ---
        function calcArea(layer) {
            if (layer instanceof L.Polygon) {
                const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                const cap = Math.floor(area * currentRatio);
                const txt = `<b>Surface:</b> ${area.toFixed(1)} m²<br><b>Capacité:</b> ${cap} pers.`;
                document.getElementById('measure-display').innerHTML = txt;
                layer.bindPopup(txt);
            }
        }

        function updateDraw() {
            if (window.drawControl) map.removeControl(window.drawControl);
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: activeGroup },
                draw: { circle:false, marker:false, polyline:false, circlemarker:false }
            });
            map.addControl(window.drawControl);
        }

        map.on(L.Draw.Event.CREATED, e => {
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            activeGroup.addLayer(e.layer);
            calcArea(e.layer);
        });
        map.on('draw:editvertex', e => calcArea(e.poly));
        map.on(L.Draw.Event.EDITED, e => e.layers.eachLayer(l => calcArea(l)));

        // --- DRAG & DROP PICTOS ---
        function handleDrop(e) {
            e.preventDefault();
            const type = e.dataTransfer.getData('type');
            const latlng = map.mouseEventToLatLng(e);
            
            const name = prompt("Nom de l'unité ?", type + " 01");
            const time = prompt("Heure de mise en place ?", new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}));
            
            if (name) {
                const color = (type === 'CRS') ? '#0000FF' : '#5D4037';
                createUnitMarker(latlng, type, name, time, color);
            }
        }

        function createUnitMarker(latlng, type, name, time, color) {
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            
            const icon = L.divIcon({
                className: 'unit-master',
                html: `
                    <div style="position:relative;">
                        <div class="unit-box" style="width:40px; height:20px; background:${color}; border:2px solid black; color:white; font-size:9px; display:flex; align-items:center; justify-content:center; font-weight:bold;">${type}</div>
                        <div class="unit-connector" style="height:20px; width:1px; background:black; position:absolute; left:50%; top:20px;"></div>
                        <div class="unit-label" style="position:absolute; left:55%; top:35px; background:white; border:1px solid black; padding:1px 4px; font-size:9px; min-width:60px;">
                            <b>${name}</b><br>${time}
                        </div>
                    </div>
                `,
                iconSize: [40, 20],
                iconAnchor: [20, 10]
            });

            L.marker(latlng, { icon: icon, draggable: true }).addTo(activeGroup);
        }

        // --- SCALE DYNAMIQUE ---
        map.on('zoomend', () => {
            const z = map.getZoom();
            const scale = Math.max(0.3, Math.pow(1.5, z - 16));
            document.querySelectorAll('.unit-box').forEach(el => {
                el.style.transform = `scale(${scale})`;
            });
            document.querySelectorAll('.unit-label').forEach(el => {
                el.style.transform = `scale(${scale})`;
                el.style.transformOrigin = 'left top';
            });
        });

        // --- INITIALISATION ---
        addNewLayer("Principal");
        document.getElementById('ratio-slider').oninput = function() {
            currentRatio = this.value;
            document.getElementById('ratio-val').innerText = this.value;
            layersData.forEach(l => l.group.eachLayer(ly => calcArea(ly)));
        };
    </script>
</body>
</html>
