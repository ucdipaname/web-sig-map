<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Géo-Tactique V25 - Version Stable</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

<style>
:root { --sidebar-width:300px; --accent:#0070F6; }
body { margin:0; display:flex; height:100vh; font-family:'Segoe UI',sans-serif; }

#sidebar { width:var(--sidebar-width); background:#f8f9fa; border-right:1px solid #ddd; padding:15px; display:flex; flex-direction:column; z-index:1000;}
#map { flex:1; position:relative; }

.tactical-tag {
    width:80px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translateY(-100%); /* ANCRAGE PRÉCIS */
}

.t-name {
    background:white;
    border:1px solid #000;
    font-size:10px;
    font-weight:bold;
    padding:1px 3px;
    border-radius:3px 3px 0 0;
}

.t-box {
    width:60px;
    height:20px;
    border:2px solid #000;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:11px;
    margin-top:-1px;
}

.t-time {
    background:#222;
    color:#0f0;
    font-family:monospace;
    font-size:9px;
    padding:1px 3px;
    border:1px solid #000;
    border-radius:0 0 3px 3px;
    margin-top:-1px;
}

.card { background:white; padding:10px; margin-bottom:10px; border:1px solid #ddd; border-radius:5px;}
.btn { width:100%; padding:8px; margin-top:5px; cursor:pointer; font-weight:bold; border-radius:4px; border:1px solid #ccc;}
.btn-blue { background:var(--accent); color:white; border:none;}

#picto-box {
    position:absolute;
    bottom:20px;
    right:20px;
    z-index:2000;
    background:white;
    padding:10px;
    border:2px solid #333;
    display:flex;
    flex-direction:column;
    gap:5px;
    border-radius:8px;
}

.p-btn {
    width:60px;
    height:30px;
    color:white;
    border:1px solid #000;
    cursor:pointer;
    font-size:10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

.search-bar {
    position:absolute;
    top:10px;
    left:50px;
    z-index:1000;
    display:flex;
    gap:5px;
}

#search-input {
    padding:8px;
    width:200px;
    border-radius:4px;
    border:1px solid #ccc;
}
</style>
</head>

<body>

<aside id="sidebar">
<h2>GÉO-TACTIQUE V25</h2>

<div class="card">
<strong>Outils de Mesure</strong>
<div id="stats" style="font-size:0.85rem; color:#666;">Tracez une zone pour voir les infos.</div>
</div>

<div class="card">
<strong>Calques</strong>
<div id="layer-list"></div>
<button class="btn btn-blue" onclick="addLayer()">+ Nouveau Calque</button>
</div>

<button class="btn" style="background:#27ae60; color:white;" onclick="exportGeoJSON()">Exporter le plan</button>
<button class="btn" style="margin-top:auto;" onclick="location.reload()">Réinitialiser</button>
</aside>

<div id="map">

<div class="search-bar">
<input type="text" id="search-input" placeholder="Rechercher une rue...">
<button class="btn btn-blue" style="margin:0;" onclick="search()">OK</button>
</div>

<div id="picto-box">
<div class="p-btn" style="background:blue;" onclick="setMode('CRS')">CRS</div>
<div class="p-btn" style="background:#5D4037;" onclick="setMode('GM')">GM</div>
<div class="p-btn" style="background:red;" onclick="setMode('CIE')">CIE</div>
<div class="p-btn" style="background:#2c3e50;" onclick="setMode('INFO')">INFO</div>
</div>

</div>

<script>
const map = L.map('map').setView([48.8566,2.3522],13);

/* --- FONDS DE CARTE --- */
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

const osmLight = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap © CARTO'
});

const sat = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'© Esri'
});

L.control.layers({
    "OSM Standard": osm,
    "OSM Clair (léger)": osmLight,
    "Satellite": sat
}).addTo(map);

/* --- CALQUES --- */
let layers=[];
let activeLayer=null;
let modePicto=null;

function addLayer(name="Zone "+(layers.length+1)){
    const group=new L.FeatureGroup().addTo(map);
    const id=Date.now();
    layers.push({id,name,group});
    selectLayer(id);
}

function selectLayer(id){
    activeLayer=layers.find(l=>l.id===id);
    if(window.drawControl) map.removeControl(window.drawControl);

    window.drawControl=new L.Control.Draw({
        draw:{marker:true, polygon:true, polyline:true, rectangle:true, circle:false},
        edit:{featureGroup:activeLayer.group}
    });

    map.addControl(window.drawControl);
    updateUI();
}

map.on('draw:created',function(e){
    const layer=e.layer;
    activeLayer.group.addLayer(layer);

    if(layer instanceof L.Polygon){
        const area=Math.round(turf.area(layer.toGeoJSON()));
        document.getElementById('stats').innerHTML=
        `Surface : <b>${area} m²</b><br>Jauge : <b>${area*3} pers.</b>`;
    }
});

/* --- RECHERCHE --- */
async function search(){
    const val=document.getElementById('search-input').value;
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${val}`);
    const data=await res.json();
    if(data[0]) map.setView([data[0].lat,data[0].lon],17);
}

/* --- PICTOS --- */
function setMode(type){
    modePicto=type;
    map.getContainer().style.cursor='crosshair';
}

map.on('click',function(e){
    if(!modePicto||!activeLayer) return;

    const name=prompt("NOM :");
    if(!name){cancelMode(); return;}

    const time=prompt("HEURE :",new Date().getHours()+":"+String(new Date().getMinutes()).padStart(2,'0'));
    const colors={CRS:'blue',GM:'#5D4037',CIE:'red',INFO:'#2c3e50'};

    const html=`
    <div class="tactical-tag">
        <div class="t-name">${name}</div>
        <div class="t-box" style="background:${colors[modePicto]}">${modePicto}</div>
        <div class="t-time">${time}</div>
    </div>`;

    const icon=L.divIcon({
        className:'',
        html:html
    });

    L.marker(e.latlng,{
        icon:icon,
        draggable:true
    }).addTo(activeLayer.group);

    cancelMode();
});

function cancelMode(){
    modePicto=null;
    map.getContainer().style.cursor='';
}

function updateUI(){
    const list=document.getElementById('layer-list');
    list.innerHTML=layers.map(l=>`
        <div onclick="selectLayer(${l.id})"
        style="padding:5px;cursor:pointer;margin-bottom:2px;border-radius:3px;border:1px solid #ddd;
        ${activeLayer.id===l.id?'background:#e7f1ff;border-color:#0070F6;':''}">
        ${l.name}
        </div>
    `).join('');
}

function exportGeoJSON(){
    const data=activeLayer.group.toGeoJSON();
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='plan_tactique.geojson';
    a.click();
}

addLayer("Secteur 1");
</script>

</body>
</html>
