<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Opérationnelle</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Draw -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <!-- Leaflet Control Geocoder -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <!-- Leaflet Shapefile -->
    <script src="https://unpkg.com/leaflet-shp@0.4.0/dist/leaflet.shp.js"></script>
    <!-- Leaflet Omnivore (KML) -->
    <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>
    <!-- FileSaver.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: 0;
            left: 250px;
            right: 250px;
            bottom: 0;
        }
        #left-panel, #right-panel {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 250px;
            background: #f5f5f5;
            padding: 10px;
            overflow-y: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        #left-panel {
            left: 0;
        }
        #right-panel {
            right: 0;
        }
        .panel-section {
            margin-bottom: 20px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }
        .panel-section h3 {
            margin-top: 0;
            color: #333;
        }
        .layer-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .layer-item input {
            margin-right: 10px;
        }
        .icon-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .icon {
            width: 40px;
            height: 40px;
            cursor: pointer;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #text-customization {
            margin-top: 10px;
        }
        #text-customization input, #text-customization select {
            margin-bottom: 5px;
            width: 100%;
        }
        #surface-calc {
            margin-top: 10px;
        }
        #surface-calc button {
            margin-top: 5px;
            width: 100%;
        }
        .picto-form {
            margin-top: 10px;
            display: none;
        }
        .picto-form input {
            margin-bottom: 5px;
            width: 100%;
        }
        .leaflet-label-picto {
            font-size: 14px;
            font-weight: bold;
            background: white;
            padding: 3px 6px;
            border: 1px solid #ccc;
            border-radius: 3px;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
            text-align: center;
            white-space: nowrap;
        }
        .leaflet-label-name {
            margin-bottom: -20px !important;
        }
        .leaflet-label-time {
            margin-top: 20px !important;
        }
    </style>
</head>
<body>
    <div id="left-panel">
        <div class="panel-section">
            <h3>Calques</h3>
            <div id="layers-list"></div>
            <button id="add-layer">Ajouter un calque</button>
        </div>
        <div class="panel-section">
            <h3>Import/Export</h3>
            <input type="file" id="import-shapefile" accept=".zip" />
            <input type="file" id="import-kml" accept=".kml" />
            <button id="export-geojson">Exporter en GeoJSON</button>
        </div>
        <div class="panel-section">
            <h3>Modifier la surface</h3>
            <div id="surface-calc">
                <label for="surface-coeff">Coefficient multiplicateur :</label>
                <input type="number" id="surface-coeff" value="3" min="1" />
                <button id="calc-population">Calculer population</button>
                <p id="population-result"></p>
            </div>
        </div>
    </div>
    <div id="map"></div>
    <div id="right-panel">
        <div class="panel-section">
            <h3>Pictogrammes</h3>
            <div class="icon-picker">
                <div class="icon" style="background: blue; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); border: 1px solid black;" title="CRS" data-type="CRS"></div>
                <div class="icon" style="background: brown; border: 1px solid black;" title="GM" data-type="GM"></div>
                <div class="icon" style="background: red; border-radius: 50%; border: 1px solid black;" title="CIE" data-type="CIE"></div>
            </div>
            <div class="picto-form" id="picto-form">
                <input type="text" id="picto-name" placeholder="Nom (ex: CRS1)" />
                <input type="text" id="picto-time" placeholder="Heure (ex: 14h30)" />
                <button id="place-picto">Placer le picto</button>
            </div>
        </div>
        <div class="panel-section">
            <h3>Texte personnalisé</h3>
            <div id="text-customization">
                <input type="text" id="text-content" placeholder="Votre texte" />
                <input type="color" id="text-color" value="#000000" />
                <select id="text-font">
                    <option value="Arial">Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Courier New">Courier New</option>
                </select>
                <input type="range" id="text-size" min="8" max="36" value="12" />
                <button id="add-text">Ajouter texte</button>
            </div>
        </div>
    </div>

    <script>
        // Initialisation de la carte
        const map = L.map('map').setView([48.8566, 2.3522], 12);

        // Couches de base
        const baseLayers = {
            "OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }),
            "OpenStreetMap allégée": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }),
            "Vue aérienne": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            })
        };

        baseLayers["OpenStreetMap"].addTo(map);

        // Contrôle des couches de base
        L.control.layers(baseLayers).addTo(map);

        // Recherche d'adresse (Nominatim)
        L.Control.geocoder({
            geocoder: new L.Control.Geocoder.nominatim(),
            position: 'topright',
            placeholder: 'Rechercher une rue...',
            errorMessage: 'Adresse non trouvée',
            defaultMarkGeocode: true
        }).addTo(map);

        // Gestion des calques
        const overlayLayers = {};
        let layerCounter = 1;

        document.getElementById('add-layer').addEventListener('click', () => {
            const layerName = `Calque ${layerCounter++}`;
            const layer = L.featureGroup().addTo(map);
            overlayLayers[layerName] = layer;
            updateLayersList();
        });

        function updateLayersList() {
            const list = document.getElementById('layers-list');
            list.innerHTML = '';
            for (const [name, layer] of Object.entries(overlayLayers)) {
                const item = document.createElement('div');
                item.className = 'layer-item';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = map.hasLayer(layer);
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        map.addLayer(layer);
                    } else {
                        map.removeLayer(layer);
                    }
                });
                const label = document.createElement('label');
                label.textContent = name;
                item.appendChild(checkbox);
                item.appendChild(label);
                list.appendChild(item);
            }
        }

        // Import Shapefile
        document.getElementById('import-shapefile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            shp(file).then(geojson => {
                const layerName = `Shapefile ${layerCounter++}`;
                const layer = L.geoJSON(geojson).addTo(map);
                overlayLayers[layerName] = layer;
                updateLayersList();
            });
        });

        // Import KML
        document.getElementById('import-kml').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const kml = evt.target.result;
                const layerName = `KML ${layerCounter++}`;
                const layer = omnivore.kml.parse(kml).addTo(map);
                overlayLayers[layerName] = layer;
                updateLayersList();
            };
            reader.readAsText(file);
        });

        // Export GeoJSON
        document.getElementById('export-geojson').addEventListener('click', () => {
            const features = [];
            for (const layer of Object.values(overlayLayers)) {
                layer.eachLayer(l => {
                    if (l.toGeoJSON) {
                        features.push(l.toGeoJSON());
                    }
                });
            }
            const geojson = {
                type: 'FeatureCollection',
                features: features
            };
            const blob = new Blob([JSON.stringify(geojson)], {type: 'application/json'});
            saveAs(blob, 'projet.geojson');
        });

        // Outils de dessin
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);
        overlayLayers['Dessin'] = drawnItems;

        const drawControl = new L.Control.Draw({
            edit: {
                featureGroup: drawnItems
            },
            draw: {
                polygon: true,
                polyline: true,
                rectangle: false,
                circle: false,
                marker: false
            }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, (e) => {
            const layer = e.layer;
            drawnItems.addLayer(layer);
        });

        // Calcul de population
        document.getElementById('calc-population').addEventListener('click', () => {
            let totalArea = 0;
            drawnItems.eachLayer(layer => {
                if (layer instanceof L.Polygon) {
                    const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                    totalArea += area;
                }
            });
            const coeff = parseFloat(document.getElementById('surface-coeff').value);
            const population = Math.round(totalArea * coeff / 1000000);
            document.getElementById('population-result').textContent = `Population estimée : ${population} personnes`;
        });

        // Gestion des pictos
        let selectedPictoType = null;
        document.querySelectorAll('.icon').forEach(icon => {
            icon.addEventListener('click', () => {
                selectedPictoType = icon.getAttribute('data-type');
                document.getElementById('picto-form').style.display = 'block';
            });
        });

        document.getElementById('place-picto').addEventListener('click', () => {
            const name = document.getElementById('picto-name').value;
            const time = document.getElementById('picto-time').value;
            if (!selectedPictoType || !name || !time) {
                alert("Veuillez remplir tous les champs et sélectionner un picto.");
                return;
            }

            const iconOptions = {
                CRS: {
                    iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><polygon points="20,0 0,40 40,40" fill="blue" stroke="black"/></svg>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20],
                    className: 'draggable-marker'
                },
                GM: {
                    iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="0" y="0" width="40" height="40" fill="brown" stroke="black"/></svg>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20],
                    className: 'draggable-marker'
                },
                CIE: {
                    iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="red" stroke="black"/></svg>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20],
                    className: 'draggable-marker'
                }
            };

            const customIcon = L.icon(iconOptions[selectedPictoType]);

            map.once('click', (e) => {
                const latLng = e.latlng;
                const marker = L.marker(latLng, {
                    icon: customIcon,
                    draggable: true
                }).addTo(drawnItems);

                // Ajout des labels au-dessus et en dessous
                const nameLabel = L.marker(latLng, {
                    icon: L.divIcon({
                        className: 'leaflet-label-picto leaflet-label-name',
                        html: `<div>${name}</div>`
                    }),
                    zIndexOffset: 1000
                }).addTo(drawnItems);

                const timeLabel = L.marker(latLng, {
                    icon: L.divIcon({
                        className: 'leaflet-label-picto leaflet-label-time',
                        html: `<div>${time}</div>`
                    }),
                    zIndexOffset: 1000
                }).addTo(drawnItems);

                // Ajuste la position des labels
                const offset = 0.00015;
                nameLabel.setLatLng(L.latLng(latLng.lat + offset, latLng.lng));
                timeLabel.setLatLng(L.latLng(latLng.lat - offset, latLng.lng));

                // Met à jour la position des labels quand le picto est déplacé
                marker.on('dragend', function() {
                    const newLatLng = marker.getLatLng();
                    nameLabel.setLatLng(L.latLng(newLatLng.lat + offset, newLatLng.lng));
                    timeLabel.setLatLng(L.latLng(newLatLng.lat - offset, newLatLng.lng));
                });
            });

            // Réinitialise le formulaire
            document.getElementById('picto-form').style.display = 'none';
            document.getElementById('picto-name').value = '';
            document.getElementById('picto-time').value = '';
        });

        // Texte personnalisé
        document.getElementById('add-text').addEventListener('click', () => {
            const content = document.getElementById('text-content').value;
            const color = document.getElementById('text-color').value;
            const font = document.getElementById('text-font').value;
            const size = document.getElementById('text-size').value;
            map.once('click', (e) => {
                L.marker(e.latlng, {
                    icon: L.divIcon({
                        className: 'text-label',
                        html: `<div style="color:${color};font-family:${font};font-size:${size}px;background:white;padding:2px;">${content}</div>`
                    }),
                    draggable: true
                }).addTo(drawnItems);
            });
        });

        updateLayersList();
    </script>
</body>
</html>
