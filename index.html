<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carto Pro - Planification</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        body { margin: 0; display: flex; font-family: sans-serif; height: 100vh; }
        
        /* Panneau latéral gauche */
        #sidebar { 
            width: 320px; 
            background: #f8f9fa; 
            border-right: 1px solid #ccc; 
            display: flex; 
            flex-direction: column; 
            padding: 10px;
            overflow-y: auto;
        }

        /* Carte */
        #map { flex: 1; }

        .box { 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
            padding: 10px; 
            margin-bottom: 15px; 
        }
        
        .box h3 { margin-top: 0; font-size: 1.1em; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        .layer-item { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        
        .btn-group { display: flex; flex-direction: column; gap: 5px; }
        button { cursor: pointer; padding: 8px; border: 1px solid #ccc; background: #eee; border-radius: 3px; }
        button:hover { background: #ddd; }

        #stats-box { font-weight: bold; color: #2c3e50; }

        /* Styles des Pictos Custom */
        .custom-icon-container { text-align: center; }
        .label-top { font-size: 10px; font-weight: bold; margin-bottom: -2px; }
        .label-bottom { font-size: 10px; margin-top: -2px; }
        
        /* Formes des pictos */
        .shape { width: 24px; height: 24px; border: 1px solid black; margin: 0 auto; }
        .crs-shape { width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 24px solid blue; border-top: none; background: none; }
        .gm-shape { background: #8B4513; }
        .cie-shape { background: red; border-radius: 50%; }

    </style>
</head>
<body>

<div id="sidebar">
    <div class="box">
        <h3>Calques</h3>
        <div id="layer-list"></div>
    </div>

    <div class="box">
        <h3>Unités (Pictos)</h3>
        <div class="btn-group">
            <button onclick="setMode('CRS')">▲ CRS (Triangle Bleu)</button>
            <button onclick="setMode('GM')">■ GM (Carré Marron)</button>
            <button onclick="setMode('CIE')">● CIE (Rond Rouge)</button>
        </div>
        <p><small>Cliquez sur le bouton puis sur la carte.</small></p>
    </div>

    <div class="box">
        <h3>Données & Export</h3>
        <div class="btn-group">
            <label>Importer KML/SHP (Zip):</label>
            <input type="file" id="importFile" accept=".kml,.zip">
            <button onclick="exportGeoJSON()">Exporter en GeoJSON</button>
        </div>
    </div>

    <div class="box" id="stats-box">
        <h3>Mesures</h3>
        <div>Surface : <span id="area-val">0</span> m²</div>
        <div>Nb de pers. (x3) : <span id="pers-val">0</span></div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>

<script>
    // --- INITIALISATION DE LA CARTE ---
    const map = L.map('map').setView([48.8566, 2.3522], 13);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { label: 'OpenStreetMap' }).addTo(map);
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { label: 'Vue Aérienne' });
    const osmLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { label: 'OSM Allégé' });

    const baseMaps = { "OSM": osm, "Satellite": satellite, "Allégé": osmLight };
    L.control.layers(baseMaps).addTo(map);

    // --- RECHERCHE NOMINATIM ---
    L.Control.geocoder({ defaultMarkGeocode: true }).addTo(map);

    // --- GESTION DU DESSIN (Surfaces & Lignes) ---
    const drawnItems = new L.FeatureGroup().addTo(map);
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: {
            polygon: { shapeOptions: { color: '#3388ff', weight: 3 } },
            polyline: { shapeOptions: { color: '#f39c12', weight: 4 } },
            circle: false, rectangle: true, marker: false, circlemarker: false
        }
    });
    map.addControl(drawControl);

    // --- CALCULS AUTOMATIQUES ---
    map.on(L.Draw.Event.CREATED, function (e) {
        const layer = e.layer;
        drawnItems.addLayer(layer);
        updateStats();
        updateLayerList();
    });

    map.on(L.Draw.Event.EDITED, updateStats);

    function updateStats() {
        let totalArea = 0;
        drawnItems.eachLayer(layer => {
            if (layer instanceof L.Polygon) {
                totalArea += L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
            }
        });
        document.getElementById('area-val').innerText = totalArea.toFixed(2);
        document.getElementById('pers-val').innerText = Math.round(totalArea * 3);
    }

    // --- GESTION DES PICTOS (CRS, GM, CIE) ---
    let currentMode = null;

    function setMode(mode) { currentMode = mode; }

    map.on('click', function(e) {
        if (!currentMode) return;

        const name = prompt("Nom de l'unité ?", currentMode);
        const time = prompt("Heure ?", new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}));

        let shapeClass = "";
        if(currentMode === 'CRS') shapeClass = "crs-shape";
        if(currentMode === 'GM') shapeClass = "gm-shape shape";
        if(currentMode === 'CIE') shapeClass = "cie-shape shape";

        const icon = L.divIcon({
            className: 'custom-div-icon',
            html: `
                <div class="custom-icon-container">
                    <div class="label-top">${name}</div>
                    <div class="${shapeClass}"></div>
                    <div class="label-bottom">${time}</div>
                </div>`,
            iconSize: [60, 50],
            iconAnchor: [30, 25]
        });

        const marker = L.marker(e.latlng, {icon: icon, draggable: true}).addTo(drawnItems);
        marker.bindPopup(`<b>${currentMode}</b><br>Unité: ${name}<br>Arrivée: ${time}`);
        
        currentMode = null; // Reset après pose
        updateLayerList();
    });

    // --- GESTION DES CALQUES (LISTE) ---
    function updateLayerList() {
        const list = document.getElementById('layer-list');
        list.innerHTML = "";
        drawnItems.eachLayer((layer, index) => {
            const id = L.stamp(layer);
            const div = document.createElement('div');
            div.className = 'layer-item';
            div.innerHTML = `
                <input type="text" value="Calque ${id}" onchange="renameLayer(${id}, this.value)">
                <input type="checkbox" checked onclick="toggleLayer(${id})">
            `;
            list.appendChild(div);
        });
    }

    function toggleLayer(id) {
        const layer = drawnItems.getLayer(id);
        if (map.hasLayer(layer)) map.removeLayer(layer);
        else map.addLayer(layer);
    }

    // --- EXPORT / IMPORT ---
    function exportGeoJSON() {
        const data = drawnItems.toGeoJSON();
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'projet_carto.geojson';
        a.click();
    }

    // Note: L'import SHP/KML nécessiterait des librairies lourdes (shpjs). 
    // Ici, nous préparons la fonction pour du KML simple.
    document.getElementById('importFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            // Logique simplifiée : affichage du nom du fichier
            alert("Fichier " + file.name + " reçu. Intégration via parser requise (ex: omnivore).");
        };
        reader.readAsText(file);
    });

</script>

</body>
</html>
