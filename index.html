<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Sécurité Pro - Final</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root { --sidebar-width: 340px; --accent: #0070F6; --dark: #1e272e; --light-grey: #F4F4F4; --danger: #e74c3c; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { height: 60px; background: var(--dark); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 0 20px; }
        .search-container { width: 60%; position: relative; z-index: 6000; }
        #search-input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; }
        #search-results { position: absolute; top: 55px; left: 0; right: 0; background: white; border-radius: 8px; z-index: 9999; max-height: 250px; overflow-y: auto; display: none; border: 1px solid #ccc; color: black; }

        #container { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: var(--light-grey); padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
        #map { flex: 1; z-index: 1; position: relative; }

        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #eee; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 6px; color: white; font-weight: bold; margin-top: 5px; font-size: 0.85rem; text-align: center; display: block; }
        .btn-accent { background: var(--accent); }
        .btn-danger { background: var(--danger); margin-top: 10px; font-size: 10px; padding: 5px; }

        /* Formulaire Popup */
        .edit-form { display: flex; flex-direction: column; gap: 5px; min-width: 220px; padding: 5px; }
        .edit-form input, .edit-form select { padding: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
        .edit-form label { font-size: 10px; font-weight: bold; color: #666; text-transform: uppercase; margin-top: 5px; }

        /* Pictos */
        #picto-box { position: absolute; bottom: 20px; right: 20px; background: white; padding: 12px; border-radius: 8px; border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .picto-item { width: 60px; height: 35px; color: white; border: 2px solid black; font-weight: bold; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* Tooltip pour les noms */
        .layer-label-permanent { background: rgba(0,0,0,0.7); border: none; color: white; font-weight: bold; padding: 2px 5px; border-radius: 4px; font-size: 11px; }

        /* Style Texte Libre */
        .text-label-container { background: transparent !important; border: none !important; box-shadow: none !important; }

        /* Unités */
        .unit-label-container { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .unit-box { border: 2px solid black; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; width: 45px; height: 22px; font-size: 10px; }
        .unit-cie { border-radius: 50%; width: 35px; height: 35px; }
        .unit-brav { transform: rotate(45deg); width: 25px; height: 25px; margin-bottom: 8px; }
        .unit-brav span { transform: rotate(-45deg); }
        .unit-info { background: rgba(255,255,255,0.9); border: 1px solid black; padding: 1px 4px; font-size: 9px; margin-top: 2px; font-weight: bold; color: black; white-space: nowrap; border-radius: 2px; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Rechercher une adresse..." autocomplete="off">
            <div id="search-results"></div>
        </div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <h3><i class="fa-solid fa-layer-group"></i> Calques</h3>
                <div id="layers-list"></div>
                <button class="btn btn-accent" onclick="promptNewLayer()">+ Nouveau Calque</button>
            </div>

            <div class="card">
                <h3><i class="fa-solid fa-ruler"></i> Mesures</h3>
                <div id="measure-display" class="info-box" style="background: #eef6ff; padding: 10px; border-radius: 6px; border: 1px solid var(--accent); font-weight: bold; font-size: 0.85rem; color: #0056b3;">Cliquez sur une forme.</div>
                <div style="margin-top:10px;">
                    <small>Ratio : <span id="ratio-val">3</span> pers/m²</small>
                    <input type="range" id="ratio-slider" min="0.5" max="10" step="0.5" value="3" style="width:100%;">
                </div>
            </div>

            <button class="btn" style="background:#27ae60; margin-top:20px;" onclick="exportToImage()">Exporter l'image HD</button>
        </aside>

        <main id="map">
            <div id="picto-box">
                <div class="picto-item" style="background:blue" onclick="selectTool(event, 'CRS')">CRS</div>
                <div class="picto-item" style="background:#5D4037" onclick="selectTool(event, 'GM')">GM</div>
                <div class="picto-item" style="background:red; border-radius:50%" onclick="selectTool(event, 'CIE')">CIE</div>
                <div class="picto-item" style="background:green; transform:rotate(45deg)" onclick="selectTool(event, 'BRAV')"><span style="transform:rotate(-45deg)">BRAV</span></div>
                <div class="picto-item" style="background:#2c3e50; border: 2px solid gold;" onclick="selectTool(event, 'TEXT')"><i class="fa-solid fa-font"></i> TEXTE</div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-geometryutil@0.9.3/src/leaflet.geometryutil.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // --- CONFIGURATION ---
        const osmLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { crossOrigin: 'Anonymous' });
        const map = L.map('map', { center: [48.8566, 2.3522], zoom: 15, layers: [osmLight] });

        let layersData = [];
        let activeLayerId = null;
        let currentTool = null;
        let lastSelectedShape = null;

        // --- GESTION DES CALQUES ---
        function addNewLayer(name) {
            const id = Date.now();
            const group = new L.FeatureGroup().addTo(map);
            layersData.push({ id, name, group, showNames: false });
            setActiveLayer(id);
        }

        function setActiveLayer(id) {
            activeLayerId = id;
            updateUI();
        }

        function toggleNames(id) {
            const lData = layersData.find(l => l.id === id);
            lData.showNames = !lData.showNames;
            refreshLabels(lData);
            updateUI();
        }

        function refreshLabels(lData) {
            lData.group.eachLayer(layer => {
                layer.unbindTooltip();
                if (lData.showNames && layer.feature?.properties?.Nom) {
                    layer.bindTooltip(layer.feature.properties.Nom, { permanent: true, direction: 'center', className: 'layer-label-permanent' });
                }
            });
        }

        function updateUI() {
            const list = document.getElementById('layers-list');
            list.innerHTML = layersData.map(l => `
                <div style="padding:10px; margin-bottom:5px; border-radius:8px; border:1px solid #ddd; background:${l.id === activeLayerId ? '#e3f2fd' : 'white'};">
                    <div style="cursor:pointer; font-weight:bold" onclick="setActiveLayer(${l.id})">${l.name}</div>
                    <label style="font-size:11px; cursor:pointer;"><input type="checkbox" ${l.showNames ? 'checked' : ''} onchange="toggleNames(${l.id})"> Voir noms</label>
                </div>
            `).join('');

            if (window.dc) map.removeControl(window.dc);
            const activeGroup = layersData.find(l => l.id === activeLayerId).group;
            window.dc = new L.Control.Draw({
                edit: { featureGroup: activeGroup },
                draw: { marker: false, circle: false, circlemarker: false }
            });
            map.addControl(window.dc);
        }

        // --- OUTILS ET ACTIONS ---
        function selectTool(e, type) {
            e.stopPropagation();
            currentTool = type;
            map.getContainer().style.cursor = 'crosshair';
        }

        map.on('click', (e) => {
            if (!currentTool) return;
            const group = layersData.find(l => l.id === activeLayerId).group;

            if (currentTool === 'TEXT') {
                const val = prompt("Texte à afficher :");
                if (val) {
                    const size = prompt("Taille (px) :", "16");
                    const color = prompt("Couleur (ex: black, red, #00FF00) :", "black");
                    const isBold = confirm("En gras ?");
                    
                    const icon = L.divIcon({
                        className: 'text-label-container',
                        html: `<div style="font-size:${size}px; color:${color}; font-weight:${isBold ? 'bold' : 'normal'}; white-space:nowrap;">${val}</div>`,
                        iconSize: [100, 20]
                    });
                    const m = L.marker(e.latlng, { icon: icon, draggable: true }).addTo(group);
                    m.feature = { properties: { Nom: val, Type: "Texte", color: color, size: size, bold: isBold } };
                    m.bindPopup(() => createPopup(m));
                }
            } else {
                const name = prompt("Nom de l'unité ?");
                if (name) {
                    const time = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
                    let color = currentTool==='CRS'?'blue':(currentTool==='GM'?'#5D4037':(currentTool==='CIE'?'red':'green'));
                    let extra = currentTool==='CIE'?'unit-cie':(currentTool==='BRAV'?'unit-brav':'');
                    let html = `<div class="unit-label-container"><div class="unit-box ${extra}" style="background:${color}">${currentTool==='BRAV'?'<span>BRAV</span>':currentTool}</div><div class="unit-info">${name}</div><div class="unit-info">${time}</div></div>`;
                    const m = L.marker(e.latlng, { icon: L.divIcon({ className:'custom-icon', html:html, iconSize:[100,60] }), draggable: true }).addTo(group);
                    m.feature = { properties: { Nom: name, Type: "Unité" } };
                    m.bindPopup(() => createPopup(m));
                }
            }
            currentTool = null;
            map.getContainer().style.cursor = '';
        });

        // --- PERSONNALISATION DES COULEURS (SURFACIQUE) ---
        function updateStyle(id, color, op) {
            const group = layersData.find(l => l.id === activeLayerId).group;
            const layer = group.getLayer(id);
            if(layer && layer.setStyle) {
                layer.setStyle({ color: color, fillColor: color, fillOpacity: op });
                layer.feature.properties.color = color;
                layer.feature.properties.opacity = op;
            }
        }

        function createPopup(layer) {
            const id = L.stamp(layer);
            const props = layer.feature.properties;
            let html = `<div class="edit-form">`;
            html += `<label>Nom</label><input type="text" value="${props.Nom || ''}" onchange="layer.feature.properties.Nom = this.value; refreshLabels(layersData.find(l => l.id === activeLayerId))">`;

            if (layer instanceof L.Path && !(layer instanceof L.Marker)) {
                html += `<label>Couleur</label><input type="color" value="${props.color || '#3388ff'}" onchange="updateStyle(${id}, this.value, document.getElementById('op-${id}').value)">`;
                html += `<label>Opacité</label><input type="range" id="op-${id}" min="0" max="1" step="0.1" value="${props.opacity || 0.2}" onchange="updateStyle(${id}, document.querySelector('[type=color]').value, this.value)">`;
            }
            
            html += `<button class="btn btn-danger" onclick="layersData.find(l => l.id === activeLayerId).group.removeLayer(${id})">Supprimer</button></div>`;
            return html;
        }

        // --- DESSIN ET CALCULS ---
        map.on(L.Draw.Event.CREATED, (e) => {
            const layer = e.layer;
            const group = layersData.find(l => l.id === activeLayerId).group;
            group.addLayer(layer);
            layer.feature = { properties: { Nom: "Nouvelle Zone", color: "#3388ff", opacity: 0.2 } };
            layer.bindPopup(() => createPopup(layer));
            layer.on('click', () => { lastSelectedShape = layer; refreshMeasure(layer); });
        });

        function refreshMeasure(layer) {
            if (!layer || !layer.getLatLngs) return;
            const ratio = document.getElementById('ratio-slider').value;
            document.getElementById('ratio-val').innerText = ratio;
            if (layer instanceof L.Polygon) {
                const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                document.getElementById('measure-display').innerHTML = `Surface : ${area.toFixed(0)} m²<br>Capacité : ${Math.round(area * ratio)} pers.`;
            }
        }

        document.getElementById('ratio-slider').oninput = () => refreshMeasure(lastSelectedShape);
        function promptNewLayer() { let n = prompt("Nom ?"); if(n) addNewLayer(n); }
        function exportToImage() { 
            document.getElementById('picto-box').style.display = 'none';
            html2canvas(document.getElementById('map'), {useCORS: true}).then(c => {
                const a = document.createElement('a'); a.download = 'plan.png'; a.href = c.toDataURL(); a.click();
                document.getElementById('picto-box').style.display = 'flex';
            });
        }

        addNewLayer("Plan Principal");
    </script>
</body>
</html>
