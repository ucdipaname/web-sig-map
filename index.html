<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Géo-Tactique V22 - Correction Alignement</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <style>
        :root { --sidebar-width: 320px; --accent: #0070F6; --dark: #1e272e; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #sidebar { width: var(--sidebar-width); background: #f8f9fa; padding: 15px; border-right: 1px solid #ddd; overflow-y: auto; z-index: 1000; display: flex; flex-direction: column; }
        #map { flex: 1; z-index: 1; position: relative; }

        /* --- STRUCTURE PICTO CORRIGÉE --- */
        .tactical-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* On remonte tout le bloc pour que le BAS soit au centre du clic */
            transform: translate(-50%, -100%); 
            width: 80px;
            pointer-events: none;
        }

        .label-name { 
            background: white; border: 1px solid black; font-weight: bold; 
            font-size: 11px; padding: 1px 4px; white-space: nowrap; border-radius: 3px 3px 0 0;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .label-box {
            width: 60px; height: 24px; border: 2px solid black; color: white;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 12px; margin: -1px 0; z-index: 2;
        }
        .label-time {
            background: #222; color: #0f0; font-family: monospace;
            font-size: 10px; padding: 1px 4px; border: 1px solid black; border-radius: 0 0 3px 3px;
        }

        /* Barre de Recherche */
        #search-container {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            display: flex; gap: 5px; background: white; padding: 5px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #search-input { width: 220px; border: 1px solid #ccc; padding: 8px; border-radius: 4px; }

        .card { background: white; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin-top: 5px; font-size: 0.85rem; }
        .btn-accent { background: var(--accent); color: white; }
        
        #picto-box { 
            position: absolute; bottom: 30px; right: 10px; 
            background: white; padding: 10px; border-radius: 8px; 
            border: 2px solid var(--dark); z-index: 2000; display: flex; flex-direction: column; gap: 8px;
        }
        .picto-btn { width: 65px; height: 35px; border: 1px solid black; color: white; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .layer-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
        .layer-item.active { background: #e7f1ff; font-weight: bold; border-left: 4px solid var(--accent); }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 style="margin:0 0 15px 0;"><i class="fa fa-map-location-dot"></i> OPS-MAP V22</h2>
        
        <div class="card">
            <strong><i class="fa fa-ruler"></i> Mesures</strong>
            <div id="measure-output" style="font-size: 0.85rem; color: #555; margin-top:5px;">Cliquez sur un tracé.</div>
        </div>

        <div class="card">
            <strong>Calques</strong>
            <div id="layers-list" style="margin: 10px 0;"></div>
            <button class="btn btn-accent" onclick="createNewLayer()">+ Nouveau Calque</button>
        </div>

        <div class="card">
            <input type="file" id="shp-import" accept=".zip" class="btn" style="font-size:10px; background:#eee;">
            <button class="btn" style="background:#27ae60; color:white; margin-top:10px;" onclick="exportProject()">Exporter SIG (.geojson)</button>
        </div>
    </aside>

    <div id="map">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Rechercher une adresse...">
            <button class="btn btn-accent" style="margin:0; width:40px;" onclick="searchAddress()"><i class="fa fa-search"></i></button>
        </div>

        <div id="picto-box">
            <div class="picto-btn" style="background:blue" onclick="prepareUnit('CRS')">CRS</div>
            <div class="picto-btn" style="background:#5D4037" onclick="prepareUnit('GM')">GM</div>
            <div class="picto-btn" style="background:red" onclick="prepareUnit('CIE')">CIE</div>
            <div class="picto-btn" style="background:green" onclick="prepareUnit('BRAV')">BRAV</div>
            <div class="picto-btn" style="background:#2c3e50" onclick="prepareUnit('INFO')">INFO</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}');
        const map = L.map('map', { center: [48.8566, 2.3522], zoom: 14, layers: [light] });
        
        L.control.layers({"Plan": light, "Satellite": satellite}, null, {position: 'topright'}).addTo(map);

        let projectLayers = [];
        let currentActiveId = null;
        let pendingUnit = null;

        async function searchAddress() {
            const q = document.getElementById('search-input').value;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
            const data = await res.json();
            if(data[0]) map.setView([data[0].lat, data[0].lon], 17);
        }

        function createNewLayer(name = "Secteur") {
            const group = new L.FeatureGroup().addTo(map);
            const id = "L-" + Date.now();
            projectLayers.push({ id, name, group });
            setActiveLayer(id);
            updateUI();
        }

        function setActiveLayer(id) {
            currentActiveId = id;
            const active = projectLayers.find(l => l.id === id);
            if (window.drawControl) map.removeControl(window.drawControl);
            window.drawControl = new L.Control.Draw({
                edit: { featureGroup: active.group },
                draw: { polygon: true, polyline: true, rectangle: true, marker: true, circle: false }
            });
            map.addControl(window.drawControl);
            updateUI();
        }

        // --- GESTION DES PICTOS (ALIGNEMENT PIED DE BOÎTE) ---
        function prepareUnit(type) { 
            pendingUnit = type; 
            map.getContainer().style.cursor = 'crosshair'; 
        }

        map.on('click', (e) => {
            if (!pendingUnit) return;
            
            const uName = prompt("IDENTIFIANT :");
            if (!uName) { cancelPlacement(); return; }
            const uTime = prompt("HORAIRE :", new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}));
            
            const colors = { CRS: 'blue', GM: '#5D4037', CIE: 'red', BRAV: 'green', INFO: '#2c3e50' };
            
            const html = `
                <div class="tactical-wrapper">
                    <div class="label-name">${uName}</div>
                    <div class="label-box" style="background:${colors[pendingUnit]}">${pendingUnit}</div>
                    <div class="label-time">${uTime}</div>
                </div>
            `;

            const icon = L.divIcon({
                className: '', // Important : vide pour ne pas hériter des styles Leaflet
                html: html,
                iconSize: [0, 0],   // Point de dimension nulle
                iconAnchor: [0, 0]  // On ne laisse pas Leaflet décaler
            });

            const marker = L.marker(e.latlng, { icon: icon, draggable: true });
            projectLayers.find(l => l.id === currentActiveId).group.addLayer(marker);
            cancelPlacement();
        });

        function cancelPlacement() { pendingUnit = null; map.getContainer().style.cursor = ''; }

        map.on('draw:created', (e) => {
            const layer = e.layer;
            projectLayers.find(l => l.id === currentActiveId).group.addLayer(layer);
            layer.on('click', () => {
                const gj = layer.toGeoJSON();
                if (layer instanceof L.Polygon) {
                    const area = Math.round(turf.area(gj));
                    document.getElementById('measure-output').innerHTML = `Surface: <b>${area} m²</b><br>Capacité (3p/m²): <b>${area*3} pers.</b>`;
                } else if (layer instanceof L.Polyline) {
                    const len = Math.round(turf.length(gj, {units:'meters'}));
                    document.getElementById('measure-output').innerHTML = `Longueur: <b>${len} m</b>`;
                }
            });
        });

        function updateUI() {
            document.getElementById('layers-list').innerHTML = projectLayers.map(l => 
                `<div class="layer-item ${l.id === currentActiveId ? 'active' : ''}" onclick="setActiveLayer('${l.id}')">${l.name}</div>`
            ).join('');
        }

        function exportProject() {
            const all = [];
            projectLayers.forEach(l => {
                const gj = l.group.toGeoJSON();
                gj.features.forEach(f => { f.properties.calque = l.name; all.push(f); });
            });
            const blob = new Blob([JSON.stringify({type:"FeatureCollection", features:all})], {type:"application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "plan_v22.geojson"; a.click();
        }

        createNewLayer("Secteur 1");
    </script>
</body>
</html>
