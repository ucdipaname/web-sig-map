<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paris Geo Pro - Debug</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: sans-serif; overflow: hidden; }
        
        #sidebar { 
            width: 350px; 
            background: #1a1c23; 
            color: white; 
            padding: 15px; 
            overflow-y: auto; 
            z-index: 10; /* Assure que la barre est au-dessus */
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
        }

        #map { 
            flex: 1; 
            height: 100vh; 
            z-index: 1; /* La carte est en dessous des menus */
        }

        .control-panel { background: #252836; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; }
        .btn { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; border: none; border-radius: 4px; color: white; font-weight: bold; }
        .search-input { width: 100%; padding: 8px; box-sizing: border-box; background: #1a1c23; color: white; border: 1px solid #444; border-radius: 4px; }
        
        /* Style du texte sur la carte */
        .text-label-on-map { background: white; padding: 2px 5px; border-radius: 3px; border: 1px solid #333; font-weight: bold; white-space: nowrap; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="font-size: 1rem; color: #3498db;">PARIS GEO PRO</h2>
    
    <div class="control-panel">
        <div id="temp-val" style="font-size: 1.2rem;">--°C</div>
        <div id="poi-counter" style="font-size: 0.8rem; color: #95a5a6;">0 éléments</div>
    </div>

    <div class="control-panel">
        <input type="text" id="manual-search" class="search-input" placeholder="Adresse...">
        <button class="btn" style="background: #3498db;" onclick="manualSearch()">Rechercher</button>
    </div>

    <div class="control-panel">
        <label style="font-size: 0.7rem;">COULEUR ACTIVE</label>
        <input type="color" id="active-color" value="#3498db" style="width: 100%; cursor: pointer;">
    </div>

    <div class="control-panel">
        <button class="btn" style="background: #8e44ad;" onclick="activateTextTool()">🔤 Outil Texte</button>
        <button class="btn" style="background: #2c3e50;" onclick="exportToCSV()">📤 Export CSV</button>
    </div>

    <div id="fiche" class="control-panel" style="display:none; background: white; color: black;">
        <h4 id="fiche-titre" style="margin:0"></h4>
        <p id="fiche-addr" style="font-size: 0.8rem;"></p>
        <button class="btn" style="background: #e74c3c;" onclick="deleteElement()">Supprimer</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

<script>
    // Initialisation
    const map = L.map('map').setView([48.8588, 2.347], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    const markersCluster = L.markerClusterGroup().addTo(map);
    const drawnItems = new L.FeatureGroup().addTo(map);
    let isTextToolActive = false;
    let selectedLayer = null;

    // --- OUTILS DE DESSIN ---
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: { polygon: true, polyline: true, rectangle: true, circle: true, marker: false }
    });
    map.addControl(drawControl);

    map.on(L.Draw.Event.CREATED, (e) => {
        const layer = e.layer;
        const color = document.getElementById('active-color').value;
        if (layer.setStyle) layer.setStyle({ color: color, fillColor: color });
        drawnItems.addLayer(layer);
        updateCounter();
    });

    // --- GEOLOCALISATION ---
    const LocateBtn = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function() {
            const btn = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
            btn.innerHTML = '<a style="background:white; cursor:pointer; display:block; width:30px; height:30px; line-height:30px; text-align:center;">🎯</a>';
            btn.onclick = () => map.locate({setView: true, maxZoom: 16});
            return btn;
        }
    });
    map.addControl(new LocateBtn());

    // --- OUTIL TEXTE ---
    function activateTextTool() {
        isTextToolActive = true;
        map.getContainer().style.cursor = "crosshair";
    }

    map.on('click', (e) => {
        if (!isTextToolActive) return;
        const txt = prompt("Texte :");
        const color = document.getElementById('active-color').value;
        if (txt) {
            const tm = L.marker(e.latlng, {
                icon: L.divIcon({ className: 'text-label-on-map', html: `<span style="color:${color}">${txt}</span>` }),
                isText: true, content: txt
            }).addTo(drawnItems);
            tm.on('click', (ev) => {
                L.DomEvent.stopPropagation(ev);
                showFiche("Texte", txt, tm);
            });
        }
        isTextToolActive = false;
        map.getContainer().style.cursor = "";
        updateCounter();
    });

    // --- FONCTIONS GENERALES ---
    function updateCounter() {
        const total = markersCluster.getLayers().length + drawnItems.getLayers().length;
        document.getElementById('poi-counter').innerText = `${total} éléments`;
    }

    function showFiche(titre, addr, layer) {
        selectedLayer = layer;
        document.getElementById('fiche').style.display = 'block';
        document.getElementById('fiche-titre').innerText = titre;
        document.getElementById('fiche-addr').innerText = addr;
    }

    function deleteElement() {
        if (!selectedLayer) return;
        if (drawnItems.hasLayer(selectedLayer)) drawnItems.removeLayer(selectedLayer);
        else markersCluster.removeLayer(selectedLayer);
        document.getElementById('fiche').style.display = 'none';
        updateCounter();
    }

    async function manualSearch() {
        const v = document.getElementById('manual-search').value;
        const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(v)}&limit=1`);
        const d = await r.json();
        if(d.features.length > 0) {
            const c = d.features[0].geometry.coordinates;
            const m = L.marker([c[1], c[0]]).addTo(markersCluster);
            m.on('click', () => showFiche(v, d.features[0].properties.label, m));
            map.setView([c[1], c[0]], 15);
            updateCounter();
        }
    }

    function exportToCSV() {
        let csv = "Nom;Coordonnées\n";
        markersCluster.eachLayer(l => { csv += `Point;${l.getLatLng().lat},${l.getLatLng().lng}\n`; });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        a.download = "export_paris.csv"; a.click();
    }

    // Météo simplifiée
    fetch('https://api.open-meteo.com/v1/forecast?latitude=48.85&longitude=2.34&current_weather=true')
        .then(r => r.json()).then(d => {
            document.getElementById('temp-val').innerText = `${Math.round(d.current_weather.temperature)}°C`;
        });

</script>
</body>
</html>
