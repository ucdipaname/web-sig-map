<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Paris Geo Pro - Chrome Fix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    
    <style>
        html, body { height: 100%; margin: 0; display: flex; overflow: hidden; }
        
        #sidebar { 
            width: 300px; 
            background: #2c3e50; 
            color: white; 
            padding: 15px;
            z-index: 5000; /* Très haut pour Chrome */
            box-shadow: 5px 0 15px rgba(0,0,0,0.3);
        }

        #map { 
            flex: 1; 
            height: 100vh;
            z-index: 1;
            position: relative;
        }

        /* IMPORTANT pour Chrome : On s'assure que les contrôles Leaflet sont cliquables */
        .leaflet-control-container {
            pointer-events: auto !important;
        }

        .panel { background: #34495e; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        input, button { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: none; }
        button { cursor: pointer; background: #3498db; color: white; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Paris Geo Pro</h2>
    <div class="panel">
        <label>Recherche d'adresse</label>
        <input type="text" id="addrInput" placeholder="Ex: Tour Eiffel">
        <button onclick="searchAddr()">Ajouter à la carte</button>
    </div>
    
    <div class="panel">
        <label>Outils</label>
        <input type="color" id="favcolor" value="#ff0000">
        <button style="background:#8e44ad" onclick="startText()">🔤 Outil Texte</button>
    </div>

    <div id="infoBox" class="panel" style="display:none; background:white; color:black">
        <div id="infoContent"></div>
        <button style="background:#e74c3c" onclick="removeLayer()">Supprimer</button>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
    // 1. Initialisation
    const map = L.map('map').setView([48.8588, 2.347], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const drawnItems = new L.FeatureGroup().addTo(map);
    let selectedLyr = null;
    let isTextActive = false;

    // 2. Barre d'outils de dessin (Indispensable pour vos surfaces/lignes)
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: { marker: true, polyline: true, polygon: true, rectangle: true, circle: true }
    });
    map.addControl(drawControl);

    // 3. Gestion de la création
    map.on(L.Draw.Event.CREATED, function (e) {
        const layer = e.layer;
        const color = document.getElementById('favcolor').value;
        if(layer.setStyle) layer.setStyle({color: color, fillColor: color});
        
        layer.on('click', (ev) => {
            L.DomEvent.stopPropagation(ev);
            showDetails("Élément tracé", layer);
        });
        
        drawnItems.addLayer(layer);
    });

    // 4. Outil Texte
    function startText() {
        isTextActive = true;
        map.getContainer().style.cursor = "crosshair";
    }

    map.on('click', function(e) {
        if(!isTextActive) return;
        const txt = prompt("Entrez votre texte :");
        if(txt) {
            const color = document.getElementById('favcolor').value;
            const label = L.marker(e.latlng, {
                icon: L.divIcon({
                    className: 'my-label',
                    html: `<b style="color:${color}; background:white; padding:2px; border:1px solid black;">${txt}</b>`,
                    iconSize: null
                })
            }).addTo(drawnItems);
            label.on('click', (ev) => {
                L.DomEvent.stopPropagation(ev);
                showDetails(txt, label);
            });
        }
        isTextActive = false;
        map.getContainer().style.cursor = "";
    });

    // 5. Recherche
    async function searchAddr() {
        const val = document.getElementById('addrInput').value;
        const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(val)}&limit=1`);
        const d = await r.json();
        if(d.features.length > 0) {
            const coords = d.features[0].geometry.coordinates;
            const m = L.marker([coords[1], coords[0]]).addTo(drawnItems);
            m.on('click', (ev) => {
                L.DomEvent.stopPropagation(ev);
                showDetails(val, m);
            });
            map.setView([coords[1], coords[0]], 15);
        }
    }

    function showDetails(txt, lyr) {
        selectedLyr = lyr;
        document.getElementById('infoBox').style.display = 'block';
        document.getElementById('infoContent').innerText = txt;
    }

    function removeLayer() {
        if(selectedLyr) drawnItems.removeLayer(selectedLyr);
        document.getElementById('infoBox').style.display = 'none';
    }
</script>
</body>
</html>
