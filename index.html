<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Géo-Outil Pro : Menu Fixé</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        :root { --sidebar-width: 300px; --dark-blue: #2c3e50; --accent-blue: #3498db; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #top-bar { height: 60px; background: var(--dark-blue); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .search-box { width: 50%; }
        #search-input { width: 100%; padding: 10px; border-radius: 20px; border: none; outline: none; }
        
        #container { display: flex; flex: 1; position: relative; }
        #sidebar { width: var(--sidebar-width); background: #fdfdfd; border-right: 1px solid #ccc; padding: 15px; z-index: 1500; overflow-y: auto; }
        #map { flex: 1; background: #ddd; position: relative; z-index: 1; }

        /* Forcer l'affichage du menu des couches */
        .leaflet-control-layers { 
            margin-top: 10px !important; 
            box-shadow: 0 0 15px rgba(0,0,0,0.2) !important;
            border: 2px solid rgba(0,0,0,0.2) !important;
        }

        .card { background: white; border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .btn { width: 100%; padding: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; margin-bottom: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-csv { background: #8e44ad; }
        .btn-export { background: #27ae60; }
        .btn-import { background: var(--accent-blue); }
        
        #prog-container { display: none; background: #eee; border-radius: 10px; height: 18px; overflow: hidden; position: relative; margin-top: 10px; }
        #prog-bar { background: var(--accent-blue); height: 100%; width: 0%; }
        #prog-text { position: absolute; width: 100%; text-align: center; font-size: 10px; line-height: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <header id="top-bar">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Rechercher une adresse...">
        </div>
    </header>

    <div id="container">
        <aside id="sidebar">
            <div class="card">
                <button class="btn" style="background:#f39c12" onclick="map.locate({setView: true, maxZoom: 15})">
                    <i class="fa-solid fa-crosshairs"></i> Me géolocaliser
                </button>
            </div>

            <div class="card">
                <h3>Import CSV</h3>
                <button class="btn btn-csv" onclick="document.getElementById('csv-input').click()">
                    <i class="fa-solid fa-file-csv"></i> Charger CSV
                </button>
                <input type="file" id="csv-input" style="display:none" accept=".csv">
                <div id="prog-container"><div id="prog-bar"></div><div id="prog-text">0%</div></div>
            </div>

            <div class="card">
                <h3>Données</h3>
                <button class="btn btn-export" onclick="exportData()">Exporter GeoJSON</button>
                <button class="btn btn-import" onclick="document.getElementById('file-input').click()">Importer GeoJSON</button>
                <input type="file" id="file-input" style="display:none" accept=".geojson">
                <button class="btn" style="background:#e74c3c" onclick="if(confirm('Tout effacer ?')) drawnItems.clearLayers()">Effacer</button>
            </div>
        </aside>

        <main id="map"></main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script>
        // 1. Définition des fonds (URLs directes)
        const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '©CARTO' });
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '©OSM' });
        const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '©Esri' });

        // 2. Initialisation Carte
        const map = L.map('map', {
            center: [46.6, 2.2],
            zoom: 6,
            layers: [light], // Vue par défaut
            zoomControl: false
        });

        // 3. Ajout du Menu (IMPORTANT : Juste après map)
        const baseMaps = {
            "Vue Allégée": light,
            "Plan OSM": osm,
            "Satellite": sat
        };
        L.control.layers(baseMaps, null, { collapsed: false, position: 'topright' }).addTo(map);

        // Autres contrôles
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.scale({ position: 'bottomright', imperial: false }).addTo(map);

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // --- DESSIN ---
        const drawControl = new L.Control.Draw({
            position: 'topright',
            draw: { circle: false, circlemarker: false },
            edit: { featureGroup: drawnItems }
        });
        map.addControl(drawControl);

        map.on(L.Draw.Event.CREATED, (e) => {
            const l = e.layer;
            if (e.layerType === 'marker') {
                const t = prompt("Texte :");
                if (t) { l.bindPopup(t).openPopup(); l.options.description = t; }
            }
            drawnItems.addLayer(l);
        });

        // --- CSV GÉOCODAGE ---
        document.getElementById('csv-input').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = async function(ev) {
                const rows = ev.target.result.split('\n').filter(r => r.includes(',')).map(r => r.split(','));
                const h = rows[0].map(v => v.trim().toLowerCase());
                const idx = h.indexOf('adresse');
                if (idx === -1) return alert("Besoin d'une colonne 'adresse'");
                
                document.getElementById('prog-container').style.display = 'block';
                for(let i=1; i<rows.length; i++) {
                    const addr = rows[i][idx];
                    const p = Math.round((i/(rows.length-1))*100);
                    document.getElementById('prog-bar').style.width = p + "%";
                    document.getElementById('prog-text').innerText = p + "%";
                    
                    await new Promise(res => setTimeout(res, 1100));
                    try {
                        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`);
                        const d = await r.json();
                        if(d[0]) {
                            const m = L.circleMarker([d[0].lat, d[0].lon], {radius: 7, color: '#8e44ad'});
                            m.bindPopup(addr).options.description = addr;
                            drawnItems.addLayer(m);
                        }
                    } catch(err) {}
                }
                map.fitBounds(drawnItems.getBounds());
            };
            reader.readAsText(e.target.files[0]);
        };

        // --- EXPORT / RECHERCHE ---
        function exportData() {
            const blob = new Blob([JSON.stringify(drawnItems.toGeoJSON())], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'carte.geojson'; a.click();
        }

        document.getElementById('search-input').onkeypress = function(e) {
            if (e.key === 'Enter') {
                fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(this.value))
                .then(r => r.json()).then(d => { if(d[0]) map.setView([d[0].lat, d[0].lon], 15); });
            }
        };
    </script>
</body>
</html>
